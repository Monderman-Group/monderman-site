<text x="100" y="106" font-size="64" fill="#0E3A44" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif" font-weight="700">Five middles</text>
<text x="101" y="162" font-size="30" fill="#556268" text-anchor="start" font-style="italic" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Selected arrangements; some duties have no single starting year.</text>
