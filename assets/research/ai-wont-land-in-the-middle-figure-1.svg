<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="870" viewBox="0 0 1920 870">
<style>@font-face{font-family:"Neue Haas Grotesk TX Pro";src:url("../../55font.woff2");font-weight:400}@font-face{font-family:"Neue Haas Grotesk TX Pro";src:url("../../75font.woff2");font-weight:700}@font-face{font-family:"Neue Haas Grotesk TX Pro";src:url("../../56font.woff2");font-style:italic}</style><title>Five middles</title><desc>Four questions comparing selected safeguards in electricity, automobiles, aviation, prescription drugs and social media. Two social-media cells remain open. Dates identify selected milestones, not universal origins.</desc>
