<text x="106" y="354.0" font-size="30" fill="#14181B" text-anchor="start" font-style="italic" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Who is liable?</text>
<text x="371" y="336.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Utility duties;</text>
<text x="371" y="369.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">state law varies</text>
<text x="665" y="303.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Manufacturer</text>
<text x="665" y="336.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">negligence · 1916</text>
<text x="665" y="369.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Crashworthiness ·</text>
<text x="665" y="402.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">1968</text>
<text x="959" y="320.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Carriers;</text>
<text x="959" y="353.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">rules depend on the</text>
<text x="959" y="386.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">claim</text>
<text x="1253" y="320.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Manufacturer</text>
<text x="1253" y="353.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">warnings;</text>
<text x="1253" y="386.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">state-law claims</text>
<text x="106" y="474.0" font-size="30" fill="#14181B" text-anchor="start" font-style="italic" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">What is</text>
<text x="106" y="510.0" font-size="30" fill="#14181B" text-anchor="start" font-style="italic" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">disclosed?</text>
<text x="371" y="474.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Public rates</text>
<text x="371" y="507.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">and service terms</text>
<text x="665" y="474.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Safety defects</text>
<text x="665" y="507.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">and recall notices</text>
<text x="959" y="474.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Accidents and</text>
<text x="959" y="507.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">specified incidents</text>
<text x="1253" y="474.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Benefits, risks</text>
<text x="1253" y="507.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">and warnings</text>
<text x="1547" y="474.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">EU transparency</text>
<text x="1547" y="507.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">duties · 2024</text>
<text x="106" y="630.0" font-size="30" fill="#14181B" text-anchor="start" font-style="italic" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Who checks?</text>
<text x="371" y="596.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Utility commissions</text>
<text x="371" y="629.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">(no single origin</text>
<text x="371" y="662.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">date)</text>
<text x="665" y="596.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">NHTSA and courts</text>
<text x="665" y="629.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">(no single origin</text>
<text x="665" y="662.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">date)</text>
<text x="959" y="596.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Federal licensing</text>
<text x="959" y="629.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">and</text>
<text x="959" y="662.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">certification · 1926</text>
<text x="1253" y="612.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">FDA: safety · 1938</text>
<text x="1253" y="645.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Effectiveness · 1962</text>
<text x="1547" y="612.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">EU / UK oversight</text>
<text x="1547" y="645.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">2024–25</text>
<text x="106" y="768.0" font-size="30" fill="#14181B" text-anchor="start" font-style="italic" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Who pays?</text>
<text x="371" y="750.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Utility damages;</text>
<text x="371" y="783.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">state rules vary</text>
<text x="665" y="734.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Manufacturer</text>
<text x="665" y="767.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">damages</text>
<text x="665" y="800.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">and recall remedies</text>
<text x="959" y="750.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Carrier liability</text>
<text x="959" y="783.5" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">insurance</text>
<text x="1253" y="734.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Manufacturer</text>
<text x="1253" y="767.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">damages</text>
<text x="1253" y="800.0" font-size="28" fill="#14181B" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">(when recoverable)</text>
</g></svg>