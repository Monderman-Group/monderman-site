<text x="102" y="301" font-size="33" class="early" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">2004</text>
<text x="102" y="345" font-size="29" class="early" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Facebook launches</text>
<text x="102" y="384" font-size="29" class="early" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">at Harvard</text>
<text x="256" y="650" font-size="33" class="early" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">2006</text>
<text x="256" y="694" font-size="29" class="early" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Facebook opens</text>
<text x="256" y="733" font-size="29" class="early" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">to the general public</text>
<text x="620" y="301" font-size="33" class="early" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">2012</text>
<text x="620" y="345" font-size="29" class="early" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">FTC privacy consent</text>
<text x="620" y="384" font-size="29" class="early" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">order finalized</text>
<text x="1180" y="247" font-size="33" class="" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">2023</text>
<text x="1180" y="291" font-size="29" class="" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">Surgeon General youth advisory</text>
<text x="1180" y="332" font-size="29" class="" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">States sue Meta over youth harms</text>
<text x="1180" y="373" font-size="29" class="" text-anchor="start" font-family="Neue Haas Grotesk TX Pro, Arial, sans-serif">UK Online Safety Act enacted</text>
