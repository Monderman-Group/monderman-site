services:
  - type: web
    runtime: static
    name: monderman-site
    branch: main
    buildCommand: echo "Static site ready"
    staticPublishPath: .
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.monderman.com https://monderman-api.onrender.com https://ptkxrzgmeldalrkfruth.supabase.co wss://ptkxrzgmeldalrkfruth.supabase.co https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com https://checkout.stripe.com https://js.stripe.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), browsing-topics=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
