name: One-shot delete contained temp branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-contained-temp-branches.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete contained temporary branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'Commit'
            'tmp-final-stop'
            'tmp-noop'
            'tmp-noop-delete-marker'
            'tmp-noop-delete-marker2'
            'tmp-stop'
            'tmp-stop2'
            'tmp-stop3'
          )
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch"
          done
