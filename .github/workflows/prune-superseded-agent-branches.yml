name: One-shot prune superseded agent branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-superseded-agent-branches.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete only provably superseded agent branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          mapfile -t branches < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/agent/ | sed 's#^origin/##' | sort)
          deleted=0
          preserved=0
          : > /tmp/preserved-agent-branches.txt

          for branch in "${branches[@]}"; do
            [[ -n "$branch" ]] || continue
            tip=$(git rev-parse "origin/$branch")
            reason=""

            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              reason="contained-in-main"
            else
              open_count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --limit 100 --json number --jq 'length')
              if [[ "$open_count" -eq 0 ]]; then
                closed_heads=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state closed --limit 100 --json headRefOid --jq '.[].headRefOid')
                if grep -Fxq "$tip" <<< "$closed_heads"; then
                  reason="closed-pr-tip"
                fi
              fi
            fi

            if [[ -n "$reason" ]]; then
              echo "DELETE $branch ($reason)"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "PRESERVE $branch (unique/unreviewed tip)"
              echo "$branch" >> /tmp/preserved-agent-branches.txt
              preserved=$((preserved + 1))
            fi
          done

          {
            echo "## Agent branch prune"
            echo "- Deleted: $deleted"
            echo "- Preserved: $preserved"
            if [[ -s /tmp/preserved-agent-branches.txt ]]; then
              echo
              echo "### Preserved branches"
              sed 's/^/- `/' /tmp/preserved-agent-branches.txt | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
