name: One-shot surgical frontend patch
on:
  push:
    branches: [agent/final-surgical-frontend-patch]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-surgical-frontend-patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply surgical patch
        run: python scripts/surgical_frontend_patch.py
      - name: Validate frontend
        run: python scripts/validate_frontend_release.py
      - name: Commit validated patch
        run: |
          git checkout HEAD -- .github/workflows/surgical-frontend-patch.yml
          rm -f scripts/surgical_frontend_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html decision-velocity.html operational-systems.html structural-clarity.html institutional-performance.html scripts/validate_frontend_release.py scripts/surgical_frontend_patch.py
          git commit -m "Apply final surgical frontend patch"
          git push origin HEAD:agent/final-surgical-frontend-patch
