          HOME_DEMO_OUT: /tmp/report-presentation-smoke/product-home
          WORKSPACE_PRODUCT_OUT: /tmp/report-presentation-smoke/product-workspace
        run: |
          # Only these independent historical suites overlap; immutable source and build inputs stay shared.
          # The subshell contains job control and its trap, so later existing lanes are unchanged.
          (
          set -e
          set -m
          historical_joined=0
          historical_cleanup() {
            historical_cleanup_status=$?
            trap - EXIT INT TERM
            set +e
            # jobs -pr is restricted to this subshell: at most the two owned lane groups.
            historical_owned_groups="$(jobs -pr)"
            for historical_pid in $historical_owned_groups; do
              kill -TERM -- "-$historical_pid" 2>/dev/null || true
            done
            # Allow owned Node signal handlers to close detached browser children.
            # Keep observing the original groups after a lane's shell leader exits.
            historical_retained_groups="$historical_owned_groups"
            historical_cleanup_started=$SECONDS
            while :; do
              historical_still_existing_groups=""
              for historical_pid in $historical_retained_groups; do
                if kill -0 -- "-$historical_pid" 2>/dev/null; then
                  historical_still_existing_groups="$historical_still_existing_groups $historical_pid"
                fi
              done
              # An observed-gone group is retired permanently, never rediscovered or re-added.
              historical_retained_groups="$historical_still_existing_groups"
              test -n "$historical_retained_groups" || break
              test "$((SECONDS - historical_cleanup_started))" -lt 2 || break
              sleep 0.05
            done
            # Escalate only still-existing original groups after the bounded cleanup grace.
            for historical_pid in $historical_retained_groups; do
              if kill -0 -- "-$historical_pid" 2>/dev/null; then
                kill -KILL -- "-$historical_pid" 2>/dev/null || true
              fi
            done
            wait
            if [ "$historical_joined" -ne 1 ]; then
              test ! -f /tmp/report-presentation-smoke/historical-refresh-photo.log || cat /tmp/report-presentation-smoke/historical-refresh-photo.log
              test ! -f /tmp/report-presentation-smoke/historical-completion.log || cat /tmp/report-presentation-smoke/historical-completion.log
              echo "HISTORICAL_PARALLEL_ABORT exit=$historical_cleanup_status"
            fi
            exit "$historical_cleanup_status"
          }
          trap historical_cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          (
          set -e
          MARKETING_REFRESH_OUT=/tmp/report-presentation-smoke/marketing-refresh node scripts/marketing_refresh_browser_smoke.mjs
          MARKETING_PHOTO_PRESENTATION_OUT=/tmp/report-presentation-smoke/photo-presentation node scripts/marketing_photo_presentation_20261013_browser.mjs
          ) >/tmp/report-presentation-smoke/historical-refresh-photo.log 2>&1 &
          historical_refresh_photo_pid=$!
          (
          set -e
          MARKETING_COMPLETION_OUT=/tmp/report-presentation-smoke/marketing-completion node scripts/marketing_completion_browser_smoke.mjs
          ) >/tmp/report-presentation-smoke/historical-completion.log 2>&1 &
          historical_completion_pid=$!
          set +e
          wait "$historical_refresh_photo_pid"
          historical_refresh_photo_status=$?
          wait "$historical_completion_pid"
          historical_completion_status=$?
          set -e
          historical_joined=1
          historical_refresh_photo_log_status=0
          cat /tmp/report-presentation-smoke/historical-refresh-photo.log || historical_refresh_photo_log_status=$?
          historical_completion_log_status=0
          cat /tmp/report-presentation-smoke/historical-completion.log || historical_completion_log_status=$?
          echo "HISTORICAL_PARALLEL_RESULT refresh_photo=$historical_refresh_photo_status completion=$historical_completion_status"
          test "$historical_refresh_photo_status" -eq 0
          test "$historical_completion_status" -eq 0
          test "$historical_refresh_photo_log_status" -eq 0
          test "$historical_completion_log_status" -eq 0
          # Both waits are complete; no early cleanup trap survives this barrier.
          trap - EXIT INT TERM
          )
          RENDER_GIT_COMMIT="$GITHUB_SHA" node scripts/site_design_coherence_20261014_contract.mjs --built
          RENDER_GIT_COMMIT="$GITHUB_SHA" python scripts/site_design_coherence_20261014_contract.py --built
          HOMEPAGE_REFINEMENT_OUT=/tmp/report-presentation-smoke/homepage-refinement node scripts/homepage_refinement_20261014_browser.mjs
          # The independent workspace and accent suites retain their own full commands,
          # logs and exit statuses; both finish before this unchanged 60-minute job advances.
          (
          node scripts/homepage_workspace_demo_smoke.mjs
          ) >/tmp/report-presentation-smoke/coherence-workspace.log 2>&1 &
          coherence_workspace_pid=$!
          (
          GOLD_ACCENT_OUT=/tmp/report-presentation-smoke/gold-accents node scripts/public_gold_accent_smoke.mjs
          ) >/tmp/report-presentation-smoke/coherence-gold.log 2>&1 &
          coherence_gold_pid=$!
          # The new pure compiled Scope guards and current matrix share only immutable input.
          (
          set -e
          RENDER_GIT_COMMIT="$GITHUB_SHA" node scripts/scope_beta_20261014_contract.mjs --built
          RENDER_GIT_COMMIT="$GITHUB_SHA" python scripts/scope_beta_20261014_contract.py --built
          SCOPE_BETA_OUT=/tmp/report-presentation-smoke/scope-beta node scripts/scope_beta_20261014_browser.mjs
          ) >/tmp/report-presentation-smoke/scope-beta.log 2>&1 &
          scope_beta_pid=$!
          set +e
          wait "$coherence_workspace_pid"
          coherence_workspace_status=$?
          wait "$coherence_gold_pid"
          coherence_gold_status=$?
          wait "$scope_beta_pid"
          scope_beta_status=$?
          set -e
          cat /tmp/report-presentation-smoke/coherence-workspace.log
          cat /tmp/report-presentation-smoke/coherence-gold.log
          cat /tmp/report-presentation-smoke/scope-beta.log
          echo "COHERENCE_PARALLEL_RESULT workspace=$coherence_workspace_status gold=$coherence_gold_status"
          test "$coherence_workspace_status" -eq 0
          test "$coherence_gold_status" -eq 0
          test "$scope_beta_status" -eq 0
          node scripts/workspace_product_design_smoke.mjs
          REPORT_OUT=/tmp/report-presentation-smoke/report-screen-experience node scripts/report_screen_experience_smoke.mjs

      - name: Reject public and populated Workspace presentation regressions
        env:
          SITE_BASE: http://127.0.0.1:8080
          WORKSPACE_LAYOUT_OUT: /tmp/report-presentation-smoke/workspace-layout
        run: |
          node scripts/brand_surface_consistency_smoke.mjs
          node scripts/public_surface_consistency_smoke.mjs
          node scripts/workspace_layout_audit_smoke.mjs

      - name: Render and verify customer report surfaces
        env:
          REPORT_OUT: /tmp/report-presentation-smoke
        run: node scripts/report_presentation_smoke.mjs

      - name: Verify generated PDF geometry and remedy pagination
        run: python scripts/validate_generated_pdf_layout.py /tmp/report-presentation-smoke

      - name: Join complete report, public visual and phone contracts in three owned lanes
        run: |
          # Original36->37 has completed; all three lanes read the frozen candidate.
          # Keep every original38-51 command/env; join all before original52/53.
          (
          set -e
          set -m
          report_completion_joined=0
          report_completion_cleanup() {
            report_completion_cleanup_status=$?
            trap - EXIT INT TERM
            set +e
            # This subshell owns only the three lane process groups below.
            report_completion_owned_groups="$(jobs -pr)"
            for report_completion_pid in $report_completion_owned_groups; do
              kill -TERM -- "-$report_completion_pid" 2>/dev/null || true
            done
            # Preserve the existing bounded Node/browser signal-cleanup grace.
            report_completion_retained_groups="$report_completion_owned_groups"
            report_completion_cleanup_started=$SECONDS
            while :; do
              report_completion_still_existing_groups=""
              for report_completion_pid in $report_completion_retained_groups; do
                if kill -0 -- "-$report_completion_pid" 2>/dev/null; then
                  report_completion_still_existing_groups="$report_completion_still_existing_groups $report_completion_pid"
                fi
              done
              # Once observed gone, an owned group is never rediscovered or re-added.
              report_completion_retained_groups="$report_completion_still_existing_groups"
              test -n "$report_completion_retained_groups" || break
              test "$((SECONDS - report_completion_cleanup_started))" -lt 2 || break
              sleep 0.05
            done
            for report_completion_pid in $report_completion_retained_groups; do
              if kill -0 -- "-$report_completion_pid" 2>/dev/null; then
                kill -KILL -- "-$report_completion_pid" 2>/dev/null || true
              fi
            done
            wait
            if [ "$report_completion_joined" -ne 1 ]; then
              test ! -f /tmp/report-presentation-smoke/hero-phone-visual.log || cat /tmp/report-presentation-smoke/hero-phone-visual.log
              test ! -f /tmp/report-presentation-smoke/hero-phone-mobile.log || cat /tmp/report-presentation-smoke/hero-phone-mobile.log
              test ! -f /tmp/report-presentation-smoke/report-completion-remaining.log || cat /tmp/report-presentation-smoke/report-completion-remaining.log
              echo "REPORT_COMPLETION_PARALLEL_ABORT exit=$report_completion_cleanup_status"
            fi
            exit "$report_completion_cleanup_status"
          }
          trap report_completion_cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          (
          set -e
          export SITE_BASE='http://127.0.0.1:8080'
          export MOBILE_OUT='/tmp/report-presentation-smoke/mobile-site'
          # ORIGINAL_UNIT_43_VISUAL_RUN_START
          node scripts/site_system_visual_smoke.mjs
          # ORIGINAL_UNIT_43_VISUAL_RUN_END
          ) >/tmp/report-presentation-smoke/hero-phone-visual.log 2>&1 &
          report_completion_visual_pid=$!
          (
          set -e
          export SITE_BASE='http://127.0.0.1:8080'
          export MOBILE_OUT='/tmp/report-presentation-smoke/mobile-site'
          # ORIGINAL_UNIT_43_MOBILE_RUN_START
          node scripts/mobile_site_presentation_smoke.mjs
          # ORIGINAL_UNIT_43_MOBILE_RUN_END
          ) >/tmp/report-presentation-smoke/hero-phone-mobile.log 2>&1 &
          report_completion_mobile_pid=$!
          (
          set -e
          (
          # ORIGINAL_UNIT_38_RUN_START
          node scripts/report_full_pagination_smoke.mjs
          node scripts/report_actual_text_pagination_smoke.mjs
          node scripts/report_ai_action_pagination_smoke.mjs
          # ORIGINAL_UNIT_38_RUN_END
          )
          (
          # ORIGINAL_UNIT_39_RUN_START
          node scripts/sc_favorable_presentation_smoke.mjs
          SC_BROWSER=webkit node scripts/sc_favorable_presentation_smoke.mjs
          # ORIGINAL_UNIT_39_RUN_END
          )
          (
          export DV_TIMING_PRESENTATION_OUT=/tmp/report-presentation-smoke/dv-timing-presentation
          # ORIGINAL_UNIT_40_RUN_START
          node scripts/dv_timing_presentation_smoke.mjs
          # ORIGINAL_UNIT_40_RUN_END
          )
          (
          export REPORT_BASE='http://127.0.0.1:8080'
          # ORIGINAL_UNIT_41_RUN_START
          node scripts/ip_missing_recovery_browser_smoke.mjs
          # ORIGINAL_UNIT_41_RUN_END
          )
          (
          export SITE_BASE='http://127.0.0.1:8080'
          export COSMETIC_OUT='/tmp/report-presentation-smoke/cosmetic-regression'
          # ORIGINAL_UNIT_42_RUN_START
          node scripts/cosmetic_regression_smoke.mjs
          # ORIGINAL_UNIT_42_RUN_END
          )
          (
          export SITE_BASE='http://127.0.0.1:8080'
          export ORDINARY_PRINT_OUT='/tmp/report-presentation-smoke/ordinary-print'
          # ORIGINAL_UNIT_44_RUN_START
          node scripts/ordinary_page_print_smoke.mjs
          python scripts/validate_ordinary_page_print.py
          # ORIGINAL_UNIT_44_RUN_END
          )
          (
          # ORIGINAL_UNIT_45_RUN_START
          node scripts/homepage_assistant_smoke.mjs
          # ORIGINAL_UNIT_45_RUN_END
          )
          (
          export SITE_BASE='http://127.0.0.1:8080'
          # ORIGINAL_UNIT_46_RUN_START
          node scripts/first_run_browser_smoke.mjs
          node scripts/pilot_waitlist_browser_smoke.mjs
          # ORIGINAL_UNIT_46_RUN_END
          )
          (
          # ORIGINAL_UNIT_47_RUN_START
          node scripts/personalized_pattern_pilot_browser_smoke.mjs
          # ORIGINAL_UNIT_47_RUN_END
          )
          (
          # ORIGINAL_UNIT_48_RUN_START
          node scripts/pilot_feedback_browser_smoke.mjs
          # ORIGINAL_UNIT_48_RUN_END
          )
          (
          export TILE_OUT='/tmp/report-presentation-smoke/sample-tiles'
          # ORIGINAL_UNIT_49_RUN_START
          node scripts/sample_tile_smoke.mjs
          # ORIGINAL_UNIT_49_RUN_END
          )
          (
          export SAMPLE_OUT='/tmp/report-presentation-smoke/sample-product-fidelity'
          # ORIGINAL_UNIT_50_RUN_START
          node scripts/sample_product_fidelity_smoke_v2.mjs
          # ORIGINAL_UNIT_50_RUN_END
          )
          (
          export REPORT_OUT='/tmp/report-presentation-smoke'
          # ORIGINAL_UNIT_51_RUN_START
          node scripts/report_pdf_smoke.mjs
          # ORIGINAL_UNIT_51_RUN_END
          )
          ) >/tmp/report-presentation-smoke/report-completion-remaining.log 2>&1 &
          report_completion_remaining_pid=$!
          set +e
          wait "$report_completion_visual_pid"
          report_completion_visual_status=$?
          wait "$report_completion_mobile_pid"
          report_completion_mobile_status=$?
          wait "$report_completion_remaining_pid"
          report_completion_remaining_status=$?
          set -e
          report_completion_joined=1
          report_completion_visual_log_status=0
          cat /tmp/report-presentation-smoke/hero-phone-visual.log || report_completion_visual_log_status=$?
          report_completion_mobile_log_status=0
          cat /tmp/report-presentation-smoke/hero-phone-mobile.log || report_completion_mobile_log_status=$?
          report_completion_remaining_log_status=0
          cat /tmp/report-presentation-smoke/report-completion-remaining.log || report_completion_remaining_log_status=$?
          echo "HERO_PHONE_PARALLEL_RESULT refresh_photo=$report_completion_visual_status completion=$report_completion_mobile_status"
          echo "REPORT_COMPLETION_PARALLEL_RESULT visual=$report_completion_visual_status mobile=$report_completion_mobile_status remaining=$report_completion_remaining_status visual_log=$report_completion_visual_log_status mobile_log=$report_completion_mobile_log_status remaining_log=$report_completion_remaining_log_status"
          test "$report_completion_visual_status" -eq 0
          test "$report_completion_mobile_status" -eq 0
          test "$report_completion_remaining_status" -eq 0
          test "$report_completion_visual_log_status" -eq 0
          test "$report_completion_mobile_log_status" -eq 0
          test "$report_completion_remaining_log_status" -eq 0
          # All owned lanes and log reads have joined; no trap crosses this barrier.
          trap - EXIT INT TERM
          )

      - name: Verify Chromium and WebKit public release surfaces
        run: node scripts/cross_browser_public_release_smoke.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-presentation-certification
          path: |
            /tmp/report-presentation-smoke
            /tmp/sc-favorable-presentation
          if-no-files-found: warn
          retention-days: 14
