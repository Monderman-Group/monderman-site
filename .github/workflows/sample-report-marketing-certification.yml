permissions:
  contents: read

concurrency:
  group: report-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    # Preserve the full report/PDF and 84-page responsive sweeps; the expanded
    # suite exceeded 35 minutes on the hosted runner without an assertion failure.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject private source in public checkout and index
        run: node scripts/private_source_absence_smoke.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validation tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check pypdf==6.10.0 pdfplumber==0.11.9 reportlab==4.4.9

      - name: Static report contracts
        run: |
          node --check monderman-report.js
          node --check sample-report-production.js
          node --check public-sample-model.js
          node --check scripts/public_sample_preview_data_smoke.mjs
          node scripts/public_sample_preview_data_smoke.mjs
          node scripts/public_sample_projection_version_smoke.mjs
          node scripts/public_sample_fixture.mjs --check
          node scripts/homepage_preview_anchor_20260924_contract.mjs
          node scripts/homepage_report_quad_20260925_compatibility_contract.mjs
          node scripts/homepage_report_quad_20260925_contract.mjs
          ecosystem_artifact_sha="$(node -e 'const r=require("./sample-data/production-sample-release.json"); if(r.contract!=="monderman-public-sample-release/v1"||r.status!=="reviewed"||!/^[a-f0-9]{64}$/.test(r.artifact_file_sha256))throw Error("reviewed_artifact_pin_required"); process.stdout.write(r.artifact_file_sha256)')"
          python scripts/validate_six_product_ecosystem_test.py --artifact sample-data/production-diagnostic-samples.json --sha256 "$ecosystem_artifact_sha"
          node scripts/public_sample_manifest_sensitivity_smoke.mjs --check
          node scripts/refresh_public_sample_previews.mjs --check
          node scripts/report_overview_contract.mjs
          node scripts/report_overview_site_compatibility_smoke.mjs
          node scripts/report_unified_sankey_contract.mjs
          node scripts/homepage_sample_discovery_contract.mjs
          node --check scripts/generate_production_sample_outputs.mjs
          node --check scripts/authenticated_report_engine_fixture.mjs
          node --check scripts/report_presentation_smoke.mjs
          node --check scripts/report_pdf_smoke.mjs
          node --check scripts/report_authored_print_smoke.mjs
          node --check scripts/report_shared_action_conditions_smoke.mjs
          node --check scripts/report_question_blocks_smoke.mjs
          node --check scripts/report_experiential_blocks_smoke.mjs
          node --check scripts/report_source_attribution_smoke.mjs
          node --check scripts/campaign_review_keyboard_smoke.mjs
          node --check scripts/report_campaign_attribution_smoke.mjs
          node --check scripts/report_sample_copy_smoke.mjs
          node --check scripts/sample_marketing_language_hover_smoke.mjs
          node --check scripts/header_entry_visibility_smoke.mjs
          node --check scripts/ip_missing_recovery_browser_smoke.mjs
