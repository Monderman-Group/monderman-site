name: Sample report marketing certification

on:
  push:
    branches:
      - agent/customer-lexicon-sample-reports-2026-08-16-v1

permissions:
  contents: read

concurrency:
  group: sample-report-marketing-certification
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve branch candidate
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/sample-http.log 2>&1 &
          echo $! >/tmp/sample-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/sample-report.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/sample-http.log
          exit 1
      - name: Render and verify all six sample products
        env:
          SAMPLE_OUT: /tmp/sample-report-marketing-smoke
        run: node scripts/sample_report_marketing_smoke.mjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-report-marketing-certification-2026-08-16
          path: /tmp/sample-report-marketing-smoke
          if-no-files-found: warn
          retention-days: 14
