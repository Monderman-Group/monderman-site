permissions:
  contents: read

concurrency:
  group: report-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validation tooling
        run: python -m pip install --disable-pip-version-check pypdf==6.10.0 pdfplumber==0.11.9 reportlab==4.4.9

      - name: Static report contracts
        run: |
          node --check monderman-report.js
          node --check sample-report-production.js
          node --check scripts/generate_production_sample_outputs.mjs
          node --check scripts/authenticated_report_engine_fixture.mjs
          node --check scripts/report_presentation_smoke.mjs
          node --check scripts/report_pdf_smoke.mjs
          node --check scripts/sample_product_fidelity_smoke.mjs
          node --check scripts/sample_product_fidelity_smoke_v2.mjs
          node --check scripts/homepage_assistant_smoke.mjs
          node --check contact-transport.js
          node --check connect-widget.js
          node --check scripts/sample_tile_smoke.mjs
          node --check scripts/mobile_site_presentation_smoke.mjs
          node --check scripts/cosmetic_regression_smoke.mjs
          node --check scripts/ordinary_page_print_smoke.mjs
          node --check scripts/cross_browser_public_release_smoke.mjs
          node --check scripts/personalized_pattern_pilot_browser_smoke.mjs
          node --check scripts/pilot_feedback_browser_smoke.mjs
          node scripts/diagnostic_draft_recovery_smoke.mjs
          node scripts/interview_disabled_smoke.mjs
          node scripts/participant_evidence_boundary_smoke.mjs
          node scripts/signin_email_otp_smoke.mjs
          node scripts/workspace_legal_gate_smoke.mjs
          node scripts/signup_package_smoke.mjs
          node scripts/authenticated_report_engine_fixture.mjs
          python scripts/validate_diagnostic_inline_js.py
          python scripts/validate_report_presentation.py
          python scripts/validate_sample_product_fidelity.py
          python scripts/validate_six_product_ecosystem.py
          python scripts/validate_meta_synthesis_frontend.py
          python scripts/validate_pdf_house_style.py
          python scripts/validate_publication_suite.py
          python scripts/validate_production_cosmetic_certification.py
          python scripts/certification_guard_sensitivity_smoke.py

      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Serve candidate
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/report-cert-http.log 2>&1 &
          echo $! >/tmp/report-cert-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/sample-report.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/report-cert-http.log
          exit 1

      - name: Render and verify customer report surfaces
        env:
          REPORT_OUT: /tmp/report-presentation-smoke
        run: node scripts/report_presentation_smoke.mjs

      - name: Reject responsive cosmetic regressions in Chromium and WebKit
        env:
          SITE_BASE: http://127.0.0.1:8080
          COSMETIC_OUT: /tmp/report-presentation-smoke/cosmetic-regression
        run: node scripts/cosmetic_regression_smoke.mjs

      - name: Render and verify ordinary-page print pagination
        env:
          SITE_BASE: http://127.0.0.1:8080
          ORDINARY_PRINT_OUT: /tmp/report-presentation-smoke/ordinary-print
        run: |
          node scripts/ordinary_page_print_smoke.mjs
          python scripts/validate_ordinary_page_print.py

      - name: Verify generated PDF geometry and remedy pagination
        run: python scripts/validate_generated_pdf_layout.py /tmp/report-presentation-smoke

      - name: Verify homepage assistant launcher
        run: node scripts/homepage_assistant_smoke.mjs

      - name: Verify personalized Pattern pilot acceptance
        run: node scripts/personalized_pattern_pilot_browser_smoke.mjs

      - name: Verify private Pattern pilot feedback
        run: node scripts/pilot_feedback_browser_smoke.mjs

      - name: Verify responsive generated-output sample tiles
        env:
          TILE_OUT: /tmp/report-presentation-smoke/sample-tiles
        run: node scripts/sample_tile_smoke.mjs

      - name: Verify phone presentation across every HTML surface
        env:
          MOBILE_OUT: /tmp/report-presentation-smoke/mobile-site
        run: node scripts/mobile_site_presentation_smoke.mjs

      - name: Render and verify all six sample products
        env:
          SAMPLE_OUT: /tmp/report-presentation-smoke/sample-product-fidelity
        run: node scripts/sample_product_fidelity_smoke_v2.mjs

      - name: Render and verify standalone PDFs
        env:
          REPORT_OUT: /tmp/report-presentation-smoke
        run: node scripts/report_pdf_smoke.mjs

      - name: Verify Chromium and WebKit public release surfaces
        run: node scripts/cross_browser_public_release_smoke.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-presentation-certification
          path: /tmp/report-presentation-smoke
          if-no-files-found: warn
          retention-days: 14
