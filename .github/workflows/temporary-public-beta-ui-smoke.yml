name: Temporary public beta UI smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-public-beta-ui-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/temporary_public_beta_ui_smoke.mjs
