name: One-shot delete audited obsolete agent branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-audited-agent-branches.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete audited obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/dv-customer-release-2026-08-12'
            'agent/ecosystem-export-2026-08-15'
            'agent/ip-release-candidate-2026-08-14-clean1'
            'agent/sample-report-forensic-audit-2026-08-16-v1'
            'agent/sample-report-forensic-audit-2026-08-16-v2'
            'agent/six-product-public-copy-closure-2026-08-16-v1'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done
