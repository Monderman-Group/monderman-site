name: Patch OS harness targeted case mode

on:
  push:
    branches: [agent/os-harness-targeted-case-2026-08-13]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add query-selected case mode
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('operational-systems-acceptance-harness.html')
          text = path.read_text()
          text = text.replace('2026-08-13.3', '2026-08-13.4')

          anchor = '];\nconst SCORE_ITEM_RE=/^os_d|^os_c|^os_g[234]/;'
          insertion = ''' ];
          const requestedCaseId=new URLSearchParams(location.search).get("case");
          const ACTIVE_CASE_DEFINITIONS=requestedCaseId?CASE_DEFINITIONS.filter(testCase=>testCase.id===requestedCaseId):CASE_DEFINITIONS;
          if(requestedCaseId&&!ACTIVE_CASE_DEFINITIONS.length)throw new Error(`Unknown acceptance case: ${requestedCaseId}`);
          if(requestedCaseId){
            $("runBtn").textContent=`Run selected case: ${ACTIVE_CASE_DEFINITIONS[0].name}`;
            $("runStatus").textContent=`Selected 1/18: ${ACTIVE_CASE_DEFINITIONS[0].name}`;
          }
          const SCORE_ITEM_RE=/^os_d|^os_c|^os_g[234]/;'''
          insertion = insertion.replace(''' ];''', '''];''', 1)
          if 'const ACTIVE_CASE_DEFINITIONS=' not in text:
              if anchor not in text:
                  raise SystemExit('Could not locate CASE_DEFINITIONS terminator')
              text = text.replace(anchor, insertion, 1)

          replacements = {
              '$("runStatus").textContent="Running 0/18…"': '$("runStatus").textContent=`Running 0/${ACTIVE_CASE_DEFINITIONS.length}…`',
              'for(let index=0;index<CASE_DEFINITIONS.length;index++){': 'for(let index=0;index<ACTIVE_CASE_DEFINITIONS.length;index++){',
              'const testCase=CASE_DEFINITIONS[index];': 'const testCase=ACTIVE_CASE_DEFINITIONS[index];',
              'Running ${index+1}/${CASE_DEFINITIONS.length}: ${testCase.name}': 'Running ${index+1}/${ACTIVE_CASE_DEFINITIONS.length}: ${testCase.name}',
              '`PASS — ${CASE_DEFINITIONS.length} cases`': '`PASS — ${ACTIVE_CASE_DEFINITIONS.length} cases`',
              '"operational-systems-18-case-matrix.json"': '`operational-systems-${ACTIVE_CASE_DEFINITIONS.length}-case-matrix.json`'
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Could not locate targeted-mode string: {old}')

          old_signed = 'if(authToken){$("authStatus").textContent="Harness build 2026-08-13.4. Signed in. The comprehensive test creates 18 real test runs in the current account and may pause if the API rate limit is reached. It will not purchase, promote, archive, or alter other runs.";'
          new_signed = 'if(authToken){$("authStatus").textContent=`Harness build 2026-08-13.4. Signed in. This test creates ${ACTIVE_CASE_DEFINITIONS.length} real test run${ACTIVE_CASE_DEFINITIONS.length===1?"":"s"} in the current account and may pause if the API rate limit is reached. It will not purchase, promote, archive, or alter other runs.`;'
          if old_signed in text:
              text = text.replace(old_signed, new_signed, 1)
          elif new_signed not in text:
              raise SystemExit('Could not locate signed-in harness notice')

          path.write_text(text)
          match = re.search(r'<script>\s*(.*?)\s*</script>\s*</body>', text, re.S)
          if not match:
              raise SystemExit('Could not extract harness JavaScript')
          Path('/tmp/os-harness.mjs').write_text(match.group(1))
          PY
          node --check /tmp/os-harness.mjs
          git diff --check
      - name: Commit the targeted-mode repair
        run: |
          if git diff --quiet -- operational-systems-acceptance-harness.html; then
            echo 'Harness already patched.'
            exit 0
          fi
          git config user.name 'Monderman-Group'
          git config user.email 'jason.ivan.adamson@gmail.com'
          git add operational-systems-acceptance-harness.html
          git commit -m 'Add targeted Operational Systems acceptance mode'
          git push origin HEAD
