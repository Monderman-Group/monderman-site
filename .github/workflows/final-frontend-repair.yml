name: One-shot final frontend hardening
on:
  push:
    branches: [agent/final-frontend-hardening]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-frontend-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final frontend repairs
        run: python scripts/final_frontend_repair.py
      - name: Validate repaired frontend
        run: python scripts/validate_frontend_release.py
      - name: Commit validated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish frontend launch hardening"
          git push origin HEAD:agent/final-frontend-hardening
