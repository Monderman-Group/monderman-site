name: One-shot final frontend hardening
on:
  push:
    branches: [agent/final-frontend-hardening]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-frontend-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final frontend repairs
        run: python scripts/final_frontend_repair.py
      - name: Close workspace dynamic Supabase imports
        run: |
          python -c 'from pathlib import Path; p=Path("workspace.html"); t=p.read_text(); tag="<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0\" integrity=\"sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti\" crossorigin=\"anonymous\"></script>\n"; t=t.replace("await import(\"https://esm.sh/@supabase/supabase-js@2.111.0\")","window.supabase").replace("await import(\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm\")","window.supabase").replace("Supabase library failed to load from both esm.sh and jsdelivr:","Supabase library failed to initialize:"); marker="  <script type=\"module\">\n    window.__wsBooted"; t=t if tag.strip() in t else t.replace(marker,"  "+tag+marker,1); p.write_text(t)'
      - name: Validate repaired frontend
        run: python scripts/validate_frontend_release.py
      - name: Commit validated repairs
        run: |
          rm -f scripts/final_frontend_repair.py scripts/fix_workspace_sri.py .github/workflows/final-frontend-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish frontend launch hardening"
          git push origin HEAD:agent/final-frontend-hardening
