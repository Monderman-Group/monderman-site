name: Apply final-release frontend repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-release-frontend-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-release-frontend-repair-20260818
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply surgical release repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          diagnostic_routes = {
              'decision-velocity.html': '/api/decision-velocity-narrative',
              'structural-clarity.html': '/api/structural-clarity-narrative',
              'operational-systems.html': '/api/operational-systems-narrative',
              'institutional-performance.html': '/api/institutional-performance-narrative',
          }

          for name, retired_route in diagnostic_routes.items():
              p = Path(name)
              s = p.read_text()
              if name == 'decision-velocity.html':
                  old_timeout = 'const FINALIZE_TIMEOUT_MS = 90000;'
                  if old_timeout not in s:
                      raise SystemExit('Decision Velocity finalize timeout anchor changed')
                  s = s.replace(old_timeout, 'const FINALIZE_TIMEOUT_MS = 280000;', 1)

              start_token = 'if (refinedExperienceLayer?.hasInput) {'
              start = s.find(start_token)
              if start < 0:
                  raise SystemExit(f'{name}: premium narrative refresh block not found')
              end_token = '\nstate.result = result;'
              end = s.find(end_token, start)
              if end < 0:
                  raise SystemExit(f'{name}: state.result anchor not found')
              removed = s[start:end]
              if retired_route not in removed:
                  raise SystemExit(f'{name}: expected retired route not found in removal block')
              replacement = (
                  '// The authoritative narrative is generated by the finalize route.\n'
                  '// Refined experiential evidence is persisted below without a second model call.\n'
              )
              s = s[:start] + replacement + s[end:]
              if retired_route in s:
                  raise SystemExit(f'{name}: retired route remains after repair')
              p.write_text(s)

          Path('abm-decision-velocity.html').write_text('''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Decision Velocity Diagnostic | Monderman</title>
            <meta name="robots" content="noindex, nofollow" />
            <link rel="canonical" href="https://www.monderman.com/decision-velocity.html" />
            <meta http-equiv="refresh" content="0; url=decision-velocity.html" />
            <script>location.replace("decision-velocity.html" + location.search + location.hash);</script>
          </head>
          <body>
            <p><a href="decision-velocity.html">Continue to the Decision Velocity diagnostic</a></p>
          </body>
          </html>
          ''')

          validator = Path('scripts/validate_frontend_release.py')
          v = validator.read_text()
          marker = "print('frontend release errors:',len(e))"
          if marker not in v:
              raise SystemExit('frontend validator output anchor changed')
          guard = r'''
          # Retired diagnostic endpoints must never be called from customer HTML.
          retired_routes = [
           '/api/decision-velocity-score','/api/decision-velocity-narrative',
           '/api/structural-clarity-score','/api/structural-clarity-narrative',
           '/api/structural-clarity/score','/api/structural-clarity/narrative',
           '/api/operational-systems-score','/api/operational-systems-narrative',
           '/api/operational-systems/score','/api/operational-systems/narrative',
           '/api/institutional-performance-score','/api/institutional-performance-narrative',
           '/api/institutional-performance/score','/api/institutional-performance/narrative'
          ]
          for p in r.glob('*.html'):
           t=p.read_text(errors='ignore')
           for route in retired_routes:
            if route in t:e.append(p.name+': retired diagnostic route '+route)

          dv=(r/'decision-velocity.html').read_text(errors='ignore')
          m=re.search(r'const FINALIZE_TIMEOUT_MS\s*=\s*(\d+)\s*;',dv)
          if not m or int(m.group(1)) < 180000:e.append('Decision Velocity finalize timeout below 180 seconds')
          '''
          v = v.replace(marker, guard + '\n' + marker, 1)
          validator.write_text(v)
          PY

      - name: Validate repaired frontend
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_frontend_release.py
          python - <<'PY'
          from pathlib import Path
          routes = [
            '/api/decision-velocity-narrative',
            '/api/structural-clarity-narrative',
            '/api/operational-systems-narrative',
            '/api/institutional-performance-narrative',
          ]
          hits=[]
          for p in Path('.').glob('*.html'):
            t=p.read_text(errors='ignore')
            for route in routes:
              if route in t:hits.append((p.name,route))
          if hits: raise SystemExit('retired narrative callers remain: '+repr(hits))
          print('retired narrative callers: 0')
          PY
          git diff --check

      - name: Commit repaired files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Monderman release repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add decision-velocity.html structural-clarity.html operational-systems.html institutional-performance.html abm-decision-velocity.html scripts/validate_frontend_release.py
          git commit -m 'Remove retired narrative callers and align finalize timeout'
          git push origin HEAD:agent/final-release-frontend-repair-20260818
