name: One-shot Platform Brief v4 repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/platform-brief-v4.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Platform Brief visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('Monderman_Platform_Brief.html')
          text = p.read_text(encoding='utf-8')

          required_files = [
              'Platform_Brief_Image.jpg',
              'operational-systems-article.html',
              'decision-velocity-article.html',
              'structural-clarity-article.html',
              'institutional-performance-article.html',
          ]
          for name in required_files:
              if not Path(name).exists():
                  raise SystemExit(f'Missing required asset/page: {name}')

          def sub_once(pattern, repl, label, flags=re.S):
              global text
              text2, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              text = text2

          # 1) Static hero image requested by founder; remove the prior animated ring field.
          sub_once(
              r'\.system-field\{.*?@keyframes ringCCW\{to\{transform:rotate\(-360deg\)\}\}\n',
              '.slide.dark.cover{background:linear-gradient(90deg,rgba(4,24,27,.95) 0%,rgba(4,24,27,.88) 34%,rgba(4,24,27,.58) 58%,rgba(4,24,27,.22) 100%),linear-gradient(180deg,rgba(4,24,27,.08),rgba(4,24,27,.28)),url("Platform_Brief_Image.jpg") center center/cover no-repeat}.slide.dark.cover::before{background:linear-gradient(120deg,rgba(255,255,255,.014),transparent 44%)}\n',
              'hero CSS'
          )
          sub_once(
              r'(<section class="slide dark cover" id="slide-1" data-title="The category">)<svg class="system-field".*?</svg>',
              r'\1',
              'hero SVG removal'
          )

          # 2) Diagnostic cards reveal links to the four existing instrument articles.
          instrument_css = r'''.instrument-stage{display:grid;grid-template-columns:1fr 190px 1fr;grid-template-rows:auto auto;gap:14px 24px;align-items:center;margin-top:30px}.instrument-shell{min-width:0}.instrument-shell.sc{grid-column:1;grid-row:1}.instrument-shell.dv{grid-column:3;grid-row:1}.instrument-shell.os{grid-column:1;grid-row:2}.instrument-shell.ip{grid-column:3;grid-row:2}.instrument-card{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:19px 20px 18px;cursor:pointer;transition:transform 220ms var(--ease),border-color 220ms var(--ease),box-shadow 220ms var(--ease)}.instrument-card:hover{transform:translateY(-2px);border-color:rgba(12,110,120,.28);box-shadow:0 12px 28px rgba(24,25,28,.055)}.instrument-card.is-active{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}.instrument-head{display:flex;align-items:center;gap:12px;margin-bottom:11px}.instrument-card h3{margin:0;font-size:1.04rem}.instrument-card p{margin:0;color:var(--muted);font-size:.85rem;line-height:1.45}.instrument-article{display:flex;align-items:center;justify-content:space-between;max-height:0;overflow:hidden;opacity:0;pointer-events:none;margin:0 12px;color:var(--teal);font-size:.72rem;font-weight:700;letter-spacing:.01em;transition:max-height 220ms var(--ease),opacity 180ms ease,margin 220ms var(--ease)}.instrument-article::after{content:"→";font-size:.95rem;transition:transform 180ms ease}.instrument-card.is-active + .instrument-article,.instrument-shell:hover .instrument-article,.instrument-shell:focus-within .instrument-article{max-height:34px;opacity:1;pointer-events:auto;margin-top:8px}.instrument-article:hover::after,.instrument-article:focus-visible::after{transform:translateX(3px)}.instrument-center{grid-column:2;grid-row:1/3;align-self:stretch;border:1px solid rgba(12,110,120,.20);border-radius:999px;background:linear-gradient(180deg,rgba(12,110,120,.055),rgba(12,110,120,.02));display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}.instrument-center strong{font-size:.98rem;line-height:1.25}.instrument-readout{margin:18px auto 0;max-width:720px;min-height:68px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:16px}.instrument-readout strong{font-size:.88rem}.instrument-readout span{font-size:.82rem;color:var(--muted);text-align:right}
'''
          sub_once(r'\.instrument-stage\{.*?\.instrument-readout span\{font-size:\.82rem;color:var\(--muted\);text-align:right\}\n', instrument_css, 'instrument CSS')

          instrument_markup = r'''<div class="instrument-stage reveal delay-2"><div class="instrument-shell sc"><button class="instrument-card is-active" type="button" data-name="Structural Clarity" data-copy="Is the system legible?"><div class="instrument-head"><svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><path class="glyph-stroke" d="M7 9h9M7 16h18M7 23h13"/></svg><h3>Structural Clarity</h3></div><p>Is the system legible?</p></button><a class="instrument-article" href="structural-clarity-article.html">Read the Structural Clarity article</a></div><div class="instrument-shell dv"><button class="instrument-card" type="button" data-name="Decision Velocity" data-copy="Does time move through it?"><div class="instrument-head"><svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><path class="glyph-stroke" d="M8 24 24 8M15 8h9v9"/></svg><h3>Decision Velocity</h3></div><p>Does time move through it?</p></button><a class="instrument-article" href="decision-velocity-article.html">Read the Decision Velocity article</a></div><div class="instrument-center"><strong>Administrative<br/>reality</strong></div><div class="instrument-shell os"><button class="instrument-card" type="button" data-name="Operational Systems" data-copy="How much weight is it carrying?"><div class="instrument-head"><svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><rect class="glyph-stroke" x="6" y="7" width="20" height="18" rx="3"/><path class="glyph-stroke" d="M10 12h12M10 17h12M10 22h7"/></svg><h3>Operational Systems</h3></div><p>How much weight is it carrying?</p></button><a class="instrument-article" href="operational-systems-article.html">Read the Operational Systems article</a></div><div class="instrument-shell ip"><button class="instrument-card" type="button" data-name="Institutional Performance" data-copy="Does it still hold under load?"><div class="instrument-head"><svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><path class="glyph-stroke" d="M6 26h21M9 24V15M16 24V8M23 24v-6"/></svg><h3>Institutional Performance</h3></div><p>Does it still hold under load?</p></button><a class="instrument-article" href="institutional-performance-article.html">Read the Institutional Performance article</a></div></div>'''
          sub_once(r'<div class="instrument-stage reveal delay-2">.*?</div><div class="instrument-readout reveal delay-3"', instrument_markup + '<div class="instrument-readout reveal delay-3"', 'instrument markup')

          # 3) Distinct product visuals: a one-instrument distribution for Depth; multi-lens convergence + evidence gate for Cross-Lens.
          scale_css = r'''.scale-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:32px;align-items:stretch}.scale-card{position:relative;border:1px solid var(--line-dark);border-radius:15px;padding:21px;background:rgba(255,255,255,.032);min-height:202px}.scale-card::after{content:"→";position:absolute;right:-19px;top:50%;color:rgba(255,255,255,.24);font-size:1.1rem}.scale-card:last-child::after{display:none}.scale-card .num{font-size:.65rem;letter-spacing:.16em;color:var(--teal-light);margin-bottom:15px}.scale-card h3{margin:0 0 8px;color:#fff;font-size:1rem}.scale-card p{margin:0;color:rgba(244,239,230,.64);font-size:.8rem;line-height:1.52}.run-viz,.campaign-viz,.depth-viz,.cross-viz{height:58px;margin-bottom:14px;position:relative}.run-viz{display:grid;place-items:center}.run-viz i{width:14px;height:14px;border-radius:50%;background:var(--teal-light);box-shadow:0 0 0 7px rgba(169,207,210,.08)}.campaign-viz i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--teal-light);opacity:.72;animation:participantDrift 4.8s ease-in-out infinite alternate}.campaign-viz i:nth-child(1){left:8%;top:38%}.campaign-viz i:nth-child(2){left:24%;top:12%;animation-delay:-.8s}.campaign-viz i:nth-child(3){left:38%;top:54%;animation-delay:-1.7s}.campaign-viz i:nth-child(4){left:55%;top:22%;animation-delay:-2.4s}.campaign-viz i:nth-child(5){left:73%;top:47%;animation-delay:-3.1s}.campaign-viz i:nth-child(6){left:88%;top:16%;animation-delay:-3.8s}@keyframes participantDrift{to{transform:translateY(5px);opacity:.94}}.depth-viz{border-bottom:1px solid rgba(169,207,210,.28)}.depth-viz::before{content:"one Diagnostic";position:absolute;left:0;top:0;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(244,239,230,.44)}.depth-viz i{position:absolute;bottom:-5px;width:10px;height:10px;border-radius:50%;background:var(--teal-light);opacity:.74;left:var(--x);animation:depthPulse 3.8s ease-in-out infinite alternate}.depth-viz i:nth-of-type(2){animation-delay:-.7s}.depth-viz i:nth-of-type(3){animation-delay:-1.4s}.depth-viz i:nth-of-type(4){animation-delay:-2.1s}.depth-viz i:nth-of-type(5){animation-delay:-2.8s}.depth-viz i:nth-of-type(6){animation-delay:-3.4s}.depth-median{position:absolute;left:52%;bottom:-8px;width:2px;height:38px;background:var(--orange);transform:translateX(-1px)}.depth-median::after{content:"median";position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:.56rem;color:#E5B15F;letter-spacing:.05em;text-transform:uppercase}@keyframes depthPulse{to{transform:translateY(-4px);opacity:1}}.cross-viz{height:66px}.cross-viz svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.cross-path{fill:none;stroke:rgba(169,207,210,.44);stroke-width:1.2;stroke-dasharray:4 5;animation:crossFlow 6s linear infinite}.cross-path:nth-child(2){animation-delay:-1.5s}.cross-path:nth-child(3){animation-delay:-3s}.cross-path:nth-child(4){animation-delay:-4.5s}@keyframes crossFlow{to{stroke-dashoffset:-36}}.cross-source{position:absolute;width:26px;height:20px;border:1px solid rgba(169,207,210,.28);border-radius:6px;display:grid;place-items:center;font-size:.55rem;font-weight:700;color:var(--teal-light);background:rgba(255,255,255,.035)}.cross-source.sc{left:0;top:0}.cross-source.dv{left:0;top:25px}.cross-source.os{left:0;top:50px}.cross-source.ip{left:42px;top:50px}.cross-gate{position:absolute;right:5px;top:16px;width:58px;height:38px;border:1px solid rgba(201,130,31,.55);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:.54rem;line-height:1.15;letter-spacing:.05em;text-transform:uppercase;color:#E5B15F;background:rgba(201,130,31,.07)}.composite-gate{margin-top:20px;padding:13px 16px;border:1px solid rgba(201,130,31,.34);border-radius:11px;display:flex;align-items:center;gap:11px;color:rgba(244,239,230,.74);font-size:.8rem}.composite-gate i{width:7px;height:7px;border-radius:2px;background:var(--orange);flex:0 0 auto}
'''
          sub_once(r'\.scale-flow\{.*?\.composite-gate i\{width:7px;height:7px;border-radius:2px;background:var\(--orange\);flex:0 0 auto\}\n', scale_css, 'scale CSS')

          scale_markup = r'''<div class="scale-flow reveal delay-2"><div class="scale-card"><div class="num">01 · RUN</div><div class="run-viz" aria-hidden="true"><i></i></div><h3>One Diagnostic</h3><p>A scored Result from one Diagnostic, at a defined vantage and depth.</p></div><div class="scale-card"><div class="num">02 · CAMPAIGN</div><div class="campaign-viz" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><h3>Participant evidence</h3><p>Completed campaign runs add structured evidence from the people doing or governing the work.</p></div><div class="scale-card"><div class="num">03 · DEPTH</div><div class="depth-viz" aria-hidden="true"><i style="--x:10%"></i><i style="--x:25%"></i><i style="--x:39%"></i><i style="--x:54%"></i><i style="--x:68%"></i><i style="--x:84%"></i><span class="depth-median"></span></div><h3>Depth Synthesis</h3><p>Eligible runs from one Diagnostic are summarized as one evidence set.</p></div><div class="scale-card"><div class="num">04 · CROSS-LENS</div><div class="cross-viz" aria-hidden="true"><span class="cross-source sc">SC</span><span class="cross-source dv">DV</span><span class="cross-source os">OS</span><span class="cross-source ip">IP</span><svg viewBox="0 0 200 66" preserveAspectRatio="none"><path class="cross-path" d="M28 10 C75 10 92 24 135 31"/><path class="cross-path" d="M28 35 C76 35 96 31 135 31"/><path class="cross-path" d="M28 60 C76 60 95 40 135 31"/><path class="cross-path" d="M68 60 C94 56 110 39 135 31"/></svg><span class="cross-gate">evidence<br/>gate</span></div><h3>Cross-Lens Synthesis</h3><p>Eligible evidence from different Diagnostics is compared without pretending the lenses are identical.</p></div></div>'''
          sub_once(r'<div class="scale-flow reveal delay-2">.*?</div><div class="composite-gate reveal delay-3">', scale_markup + '<div class="composite-gate reveal delay-3">', 'scale markup')

          # 4) Use the complete homepage report tile, not a simplified facsimile.
          report_css = r'''.hero-report-proof{position:relative;width:100%;color:#18191C}.hero-report-link{display:block;color:inherit;text-decoration:none}.hero-report-page{position:relative;min-height:366px;padding:25px 27px 22px;overflow:hidden;background:linear-gradient(180deg,#FFFFFF 0%,#FAFAF8 100%);border:1px solid rgba(143,196,201,.72);border-radius:3px;box-shadow:0 8px 22px rgba(1,17,20,.12),0 2px 7px rgba(1,17,20,.07);transition:transform 220ms cubic-bezier(.22,1,.36,1),box-shadow 220ms ease}.hero-report-link:hover .hero-report-page,.hero-report-link:focus-visible .hero-report-page{transform:translateY(-2px);box-shadow:0 11px 27px rgba(1,17,20,.16),0 3px 9px rgba(1,17,20,.09)}.hrp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:-25px -27px 0;padding:17px 27px 15px;background:#08383E;border-bottom:1px solid rgba(255,255,255,.12)}.hrp-brand{font-size:13px;font-weight:700;letter-spacing:-.025em;color:#fff}.hrp-meta{text-align:right;font-size:7.5px;line-height:1.5;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.68)}.hrp-kicker{margin:16px 0 4px;font-size:7.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:#0C6E78}.hrp-title{margin:0;max-width:none;font-size:21px;line-height:1.05;letter-spacing:-.045em;font-weight:700;color:#18191C}.hrp-deck{margin:6px 0 0;max-width:62ch;font-size:7.7px;line-height:1.48;color:#666760}.hrp-story-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px;margin-top:15px}.hrp-story-card{position:relative;min-height:184px;padding:13px 14px 12px;background:#F2EFE8;border:1px solid #E2DED5;overflow:hidden}.hrp-story-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px}.hrp-story-head strong{font-size:8.8px;color:#242528}.hrp-story-head span{font-size:6.2px;letter-spacing:.08em;text-transform:uppercase;color:#85867F}.hrp-recovery-visual{display:grid;grid-template-columns:100px 1fr;gap:13px;align-items:center}.hrp-recovery-ring{width:96px;height:96px;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(#C9821F 0 30%,#DDDAD2 30% 100%)}.hrp-recovery-ring::after{content:"";position:absolute;inset:13px;border-radius:50%;background:#F2EFE8}.hrp-recovery-center{position:relative;z-index:1;text-align:center;line-height:1}.hrp-recovery-center b{display:block;font-size:24px;letter-spacing:-.055em;color:#08383E}.hrp-recovery-center span{display:block;margin-top:3px;font-size:6px;line-height:1.25;letter-spacing:.08em;text-transform:uppercase;color:#70716B}.hrp-recovery-metrics{display:grid;gap:9px}.hrp-recovery-metric{padding-bottom:8px;border-bottom:1px solid #D7D3CA}.hrp-recovery-metric:last-child{padding-bottom:0;border-bottom:0}.hrp-recovery-metric span{display:block;font-size:6.2px;letter-spacing:.1em;text-transform:uppercase;color:#77786F}.hrp-recovery-metric b{display:block;margin-top:3px;font-size:15px;line-height:1;color:#123E52;letter-spacing:-.035em}.hrp-recovery-metric:nth-child(2) b{color:#0C6E78}.hrp-recovery-metric:nth-child(3) b{color:#C9821F}.hrp-recovery-note{margin:10px 0 0;font-size:6.3px;line-height:1.4;color:#787973}.hrp-composition-bars{display:grid;gap:10px;margin-top:4px}.hrp-composition-row{display:grid;grid-template-columns:72px 1fr 24px;gap:8px;align-items:center}.hrp-composition-row span,.hrp-composition-row b{font-size:6.8px;color:#666760}.hrp-composition-row b{text-align:right;color:#0A4046}.hrp-composition-track{height:11px;background:#DCE5E4;overflow:hidden}.hrp-composition-fill{display:block;height:100%;background:#08383E}.hrp-composition-row:nth-child(1) .hrp-composition-fill{background:#123E52}.hrp-composition-row:nth-child(2) .hrp-composition-fill{background:#0C6E78}.hrp-composition-row:nth-child(3) .hrp-composition-fill{background:#5A86A2}.hrp-composition-row:nth-child(4) .hrp-composition-fill{background:#6F927C}.hrp-composition-note{margin:12px 0 0;padding-top:8px;border-top:1px solid #D7D3CA;font-size:6.3px;line-height:1.42;color:#787973}.hrp-finding{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:11px}.hrp-finding-block{padding:9px 11px;border-left:2px solid #0C6E78;background:rgba(143,196,201,.12)}.hrp-finding-block:last-child{border-left-color:#08383E;background:rgba(8,56,62,.055)}.hrp-finding-block span{display:block;font-size:6.3px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0C6E78}.hrp-finding-block:last-child span{color:#08383E}.hrp-finding-block p{margin:4px 0 0;font-size:7px;line-height:1.42;color:#5F605B}.hrp-footer{display:flex;justify-content:space-between;margin-top:11px;padding-top:8px;border-top:1px solid #DCD9D1;font-size:6.3px;letter-spacing:.08em;text-transform:uppercase;color:#92938B}.hero-report-caption{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:12px;color:var(--teal);font-size:12px;font-weight:600;letter-spacing:-.01em}.hero-report-caption span:last-child{font-size:17px;transition:transform 180ms ease}.hero-report-link:hover .hero-report-caption span:last-child{transform:translateX(4px)}.print-preview{display:none}
'''
          sub_once(r'\.report-preview-link\{.*?\.print-preview\{display:none\}\n', report_css, 'report CSS')

          report_markup = r'''<div class="reveal delay-2"><aside class="hero-report-proof" aria-label="Sample Monderman report preview"><a class="hero-report-link" href="sample-report.html" aria-label="View complete Monderman sample reports"><div class="hero-report-page"><div class="hrp-top"><span class="hrp-brand">Monderman</span><span class="hrp-meta">Operational Systems<br/>Executive Report</span></div><p class="hrp-kicker">Composite report view &middot; representative output</p><h3 class="hrp-title">The operating burden is measurable&mdash;and part of it is recoverable.</h3><p class="hrp-deck">A Monderman report connects the measured condition to annual exposure, capacity that can be reclaimed, and the intervention the evidence supports first.</p><div class="hrp-story-grid"><div class="hrp-story-card" aria-label="Representative recovery opportunity"><div class="hrp-story-head"><strong>Recovery opportunity</strong><span>Annualized</span></div><div class="hrp-recovery-visual"><div class="hrp-recovery-ring" aria-hidden="true"><div class="hrp-recovery-center"><b>30%</b><span>potentially<br/>recoverable</span></div></div><div class="hrp-recovery-metrics"><div class="hrp-recovery-metric"><span>Burden exposed</span><b>5,280 hrs</b></div><div class="hrp-recovery-metric"><span>Annual cost</span><b>$411,840</b></div><div class="hrp-recovery-metric"><span>Recovery value</span><b>$123,552</b></div></div></div><p class="hrp-recovery-note">Directional estimate using the sample organization&rsquo;s run frequency, coordination time, and loaded hourly cost.</p></div><div class="hrp-story-card" aria-label="Representative measured burden composition"><div class="hrp-story-head"><strong>Where the burden concentrates</strong><span>Scored dimensions</span></div><div class="hrp-composition-bars" aria-hidden="true"><div class="hrp-composition-row"><span>Coordination load</span><i class="hrp-composition-track"><i class="hrp-composition-fill" style="width:84%"></i></i><b>34%</b></div><div class="hrp-composition-row"><span>Reporting burden</span><i class="hrp-composition-track"><i class="hrp-composition-fill" style="width:67%"></i></i><b>27%</b></div><div class="hrp-composition-row"><span>Process density</span><i class="hrp-composition-track"><i class="hrp-composition-fill" style="width:57%"></i></i><b>23%</b></div><div class="hrp-composition-row"><span>Recurring overhead</span><i class="hrp-composition-track"><i class="hrp-composition-fill" style="width:40%"></i></i><b>16%</b></div></div><p class="hrp-composition-note">Composition reflects the diagnostic burden signal. The engine does not allocate dollars to individual dimensions.</p></div></div><div class="hrp-finding"><div class="hrp-finding-block"><span>What the engine found</span><p>Recurring coordination work is absorbing material capacity beyond the administration required to keep the system controlled.</p></div><div class="hrp-finding-block"><span>What to do first</span><p>Target the highest-frequency burden before adding controls, preserving necessary administration while removing avoidable repetition.</p></div></div><div class="hrp-footer"><span>Sample organization</span><span>Time &middot; cost &middot; capacity</span></div></div><div class="hero-report-caption"><span>Explore complete sample reports</span><span aria-hidden="true">&rarr;</span></div></a></aside><div class="print-preview"><p class="eyebrow" style="margin-bottom:9px">Current product evidence</p><strong>Sample Reports</strong><p class="micro" style="margin:7px 0 0">View the current Diagnostic and Synthesis report formats at monderman.com/sample-report.html.</p></div></div>'''
          sub_once(r'<div class="reveal delay-2"><a class="report-preview-link".*?</div></div></div></section>\n<section class="slide white" id="slide-8"', report_markup + '</div></section>\n<section class="slide white" id="slide-8"', 'report markup')

          # 5) Economics visual now shows the actual information flow instead of arbitrary bar widths.
          econ_css = r'''.economics-map{position:relative;margin-top:28px;border:1px solid var(--line);border-radius:18px;background:#fff;padding:24px;display:grid;grid-template-columns:minmax(0,.92fr) 46px minmax(0,1.08fr);gap:18px;align-items:center}.econ-left{display:grid;grid-template-columns:1fr;gap:11px}.econ-block{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:16px 17px}.econ-block>span,.econ-recovery>span{display:block;font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:5px}.econ-block>strong,.econ-recovery>strong{display:block;font-size:1rem;letter-spacing:-.02em;color:var(--ink)}.econ-block>small,.econ-recovery>small{display:block;margin-top:4px;font-size:.72rem;line-height:1.45;color:var(--muted)}.econ-plus{position:absolute;left:calc(33% - 9px);top:50%;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--muted2);font-size:.8rem}.econ-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.econ-chips i{font-style:normal;font-size:.66rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#fff}.econ-arrow{font-size:1.65rem;text-align:center;color:var(--teal);animation:econNudge 2.8s ease-in-out infinite}@keyframes econNudge{50%{transform:translateX(4px)}}.econ-scenario{background:#fff;border-color:rgba(12,110,120,.28);padding:19px}.econ-output-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.econ-output-row div{padding:12px;border-radius:10px;background:rgba(12,110,120,.055);border:1px solid rgba(12,110,120,.10)}.econ-output-row b{display:block;font-size:.82rem;color:var(--ink)}.econ-output-row small{display:block;margin-top:3px;font-size:.66rem;color:var(--muted)}.econ-recovery{margin-top:12px;padding:13px 14px;border:1px solid rgba(201,130,31,.38);border-radius:10px;background:rgba(201,130,31,.055)}.econ-recovery>span{color:#A86912}.econ-formula{grid-column:1/-1;margin:3px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:.72rem;line-height:1.5;color:var(--muted);text-align:center}
'''
          sub_once(r'\.capacity\{.*?\.capacity-note\{margin-top:18px;font-size:\.76rem;color:var\(--muted\);line-height:1\.55\}\n', econ_css, 'economics CSS')

          econ_markup = r'''<div class="economics-map reveal delay-2" aria-label="How Monderman maps measured condition and disclosed sizing inputs into a directional exposure scenario"><div class="econ-left"><div class="econ-block"><span>Measured</span><strong>Diagnostic condition</strong><small>Score and burden signals from the instrument.</small></div><div class="econ-block"><span>Disclosed</span><strong>Sizing inputs</strong><small>Customer-provided operating context used when the required inputs are present.</small><div class="econ-chips"><i>hours / run</i><i>annual cycles</i><i>labor rate</i><i>participant load</i></div></div></div><div class="econ-arrow" aria-hidden="true">→</div><div class="econ-block econ-scenario"><span>Directional scenario</span><strong>Annual exposure</strong><small>The model translates the measured condition and disclosed inputs into directional time and labor-cost exposure.</small><div class="econ-output-row"><div><b>Time</b><small>annual hours</small></div><div><b>Labor cost</b><small>annual dollars</small></div></div><div class="econ-recovery"><span>Modeled assumption</span><strong>Recoverable share</strong><small>Shown separately from total exposure. It is not a guaranteed saving.</small></div></div><p class="econ-formula">Measured condition + disclosed inputs → directional exposure → separately labeled recovery scenario.</p></div>'''
          sub_once(r'<div class="capacity reveal delay-2">.*?</div></div></section>\n<section class="slide dark" id="slide-9"', econ_markup + '</div></section>\n<section class="slide dark" id="slide-9"', 'economics markup')

          # Responsive rules that referenced the old direct card / old visuals.
          text = text.replace('.instrument-stage{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto}.instrument-center{grid-column:1/3;grid-row:2;border-radius:16px;min-height:88px}.instrument-card:nth-of-type(1),.instrument-card:nth-of-type(2){grid-row:1}.instrument-card:nth-of-type(3),.instrument-card:nth-of-type(4){grid-row:3}', '.instrument-stage{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto}.instrument-shell.sc{grid-column:1;grid-row:1}.instrument-shell.dv{grid-column:2;grid-row:1}.instrument-center{grid-column:1/3;grid-row:2;border-radius:16px;min-height:88px}.instrument-shell.os{grid-column:1;grid-row:3}.instrument-shell.ip{grid-column:2;grid-row:3}')
          text = text.replace('.instrument-stage{grid-template-columns:1fr;grid-template-rows:auto}.instrument-center{grid-column:1;grid-row:auto;min-height:76px}.instrument-card:nth-of-type(n){grid-row:auto}', '.instrument-stage{grid-template-columns:1fr;grid-template-rows:auto}.instrument-shell.sc,.instrument-shell.dv,.instrument-shell.os,.instrument-shell.ip,.instrument-center{grid-column:1;grid-row:auto}.instrument-center{min-height:76px}')
          text = text.replace('.report-preview-card{min-height:330px}.capacity-flow{grid-template-columns:1fr}.capacity-source{height:92px}', '.hero-report-page{min-height:0}.hrp-story-grid{grid-template-columns:1fr}.economics-map{grid-template-columns:1fr}.econ-arrow{transform:rotate(90deg);animation:none}.econ-plus{display:none}.econ-formula{grid-column:1}')
          text = text.replace('.report-preview-link{display:none}.print-preview{display:block', '.hero-report-link{display:none}.print-preview{display:block')
          text = text.replace('.report-preview-link{display:none!important}.print-preview{display:block', '.hero-report-link{display:none!important}.print-preview{display:block')
          text = text.replace('.system-field .spin-cw,.system-field .spin-ccw,.dot-cloud i{animation:none!important}', '.campaign-viz i,.depth-viz i,.cross-path{animation:none!important}')

          p.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python scripts/validate_frontend_release.py

          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('Monderman_Platform_Brief.html').read_text(encoding='utf-8')
          required = [
              'Platform_Brief_Image.jpg',
              'structural-clarity-article.html', 'decision-velocity-article.html',
              'operational-systems-article.html', 'institutional-performance-article.html',
              'hrp-story-grid', 'hrp-composition-bars', 'hrp-finding',
              'depth-viz', 'depth-median', 'cross-viz', 'cross-gate',
              'economics-map', 'Directional scenario', 'Modeled assumption',
          ]
          for phrase in required:
              if phrase not in text: raise SystemExit(f'Missing required repair: {phrase}')
          forbidden = ['<svg class="system-field"', '<iframe', 'Productive effort', 'Structural overhead', 'class="capacity reveal']
          for phrase in forbidden:
              if phrase in text: raise SystemExit(f'Stale visual remains: {phrase}')
          ids = re.findall(r'\bid="([^"]+)"', text)
          dupes = sorted({x for x in ids if ids.count(x)>1})
          if dupes: raise SystemExit(f'Duplicate ids: {dupes}')
          if text.count('class="instrument-article"') != 4: raise SystemExit('Expected four article reveal links')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('Monderman_Platform_Brief.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          Path('/tmp/platform-brief-v4.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/platform-brief-v4.js

      - name: Commit Platform Brief repair
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Monderman_Platform_Brief.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          git commit -m "Refine Platform Brief product visuals"
          git push origin HEAD:main
