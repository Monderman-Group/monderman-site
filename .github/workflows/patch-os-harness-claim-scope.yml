name: Patch OS harness claim scope

on:
  push:
    branches: [agent/os-harness-claim-scope-2026-08-13]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scope the single-run claim check to generated claim sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('operational-systems-acceptance-harness.html')
          text = path.read_text()

          text = text.replace('2026-08-13.2', '2026-08-13.3')

          anchor = '  const governanceMeasured=Number.isFinite(Number(interpretiveState.governanceWeight))&&Number.isFinite(Number(interpretiveState.execResponsive));'
          scope_block = '''  const claimSectionKeys=new Set(["executive_interpretation","tradeoff_note","time_money_resources_summary","opportunity_opening","what_this_run_indicates","how_advantage_is_built_here","opportunity_rationale","first_move_1_reason","first_move_2_reason","recommended_actions_rationale","opportunity_guidance","sector_pattern"]);
          const rawNarrativeClaims=apiRun.finalized?.narrative?.narrative||{};
          const flattenClaimValue=(value)=>typeof value==="string"?value:Array.isArray(value)?value.map(flattenClaimValue).join(" "):value&&typeof value==="object"?Object.values(value).map(flattenClaimValue).join(" "):"";
          const singleRunClaimText=Object.entries(rawNarrativeClaims).filter(([key])=>claimSectionKeys.has(key)).map(([,value])=>flattenClaimValue(value)).join(" ");
          ''' + anchor
          if 'const claimSectionKeys=new Set([' not in text:
              if anchor not in text:
                  raise SystemExit('Could not locate claim-check insertion anchor')
              text = text.replace(anchor, scope_block, 1)

          old_check = '["Single-run prose avoids unsupported prevalence, causality, and forecasts",!unsupportedClaim.test(combined),(combined.match(unsupportedClaim)||["none"])[0]],'
          new_check = '["Generated single-run claims avoid unsupported prevalence, causality, and forecasts",Boolean(singleRunClaimText)&&!unsupportedClaim.test(singleRunClaimText),(singleRunClaimText.match(unsupportedClaim)||[singleRunClaimText?"none":"missing generated claim text"])[0]],'
          if old_check in text:
              text = text.replace(old_check, new_check, 1)
          elif new_check not in text:
              raise SystemExit('Could not locate the universal false-positive check')

          old_log = '        log(`${testCase.name}: ${checks.filter(check=>check.ok).length}/${checks.length} checks passing.`);'
          new_log = '        const failedNames=checks.filter(check=>!check.ok).map(check=>check.name);log(`${testCase.name}: ${checks.filter(check=>check.ok).length}/${checks.length} checks passing${failedNames.length?`; failed: ${failedNames.join(" | ")}`:""}.`);'
          if old_log in text:
              text = text.replace(old_log, new_log, 1)
          elif new_log not in text:
              raise SystemExit('Could not locate per-case harness logging')

          path.write_text(text)

          match = re.search(r'<script>\s*(.*?)\s*</script>\s*</body>', text, re.S)
          if not match:
              raise SystemExit('Could not extract harness JavaScript')
          Path('/tmp/os-harness.mjs').write_text(match.group(1))
          PY
          node --check /tmp/os-harness.mjs
          git diff --check
      - name: Commit the focused harness repair
        run: |
          if git diff --quiet -- operational-systems-acceptance-harness.html; then
            echo 'Harness already patched.'
            exit 0
          fi
          git config user.name 'Monderman-Group'
          git config user.email 'jason.ivan.adamson@gmail.com'
          git add operational-systems-acceptance-harness.html
          git commit -m 'Scope OS unsupported-claim acceptance check'
          git push origin HEAD
