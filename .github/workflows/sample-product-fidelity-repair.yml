name: Sample product fidelity repair

on:
  push:
    branches:
      - agent/sample-report-product-fidelity-2026-08-16-v1

permissions:
  contents: write

concurrency:
  group: sample-product-fidelity-repair-2026-08-16
  cancel-in-progress: true

jobs:
  repair-and-certify:
    if: ${{ !contains(github.event.head_commit.message, '[sample-fidelity-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild product-faithful Sample Reports and Synthesis renderer
        run: |
          python scripts/rebuild_sample_product_fidelity.py
          python scripts/align_synthesis_fixture_terminology.py

      - name: Run static product-fidelity and existing frontend gates
        run: |
          python scripts/validate_sample_product_fidelity.py
          python scripts/validate_frontend_release.py
          python scripts/validate_six_product_ecosystem.py
          python scripts/validate_meta_synthesis_frontend.py

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve candidate
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/sample-fidelity-http.log 2>&1 &
          echo $! >/tmp/sample-fidelity-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/sample-report.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/sample-fidelity-http.log
          exit 1

      - name: Render all six product samples
        env:
          SAMPLE_OUT: /tmp/sample-product-fidelity-smoke
        run: node scripts/sample_product_fidelity_smoke.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-product-fidelity-rendered-evidence
          path: /tmp/sample-product-fidelity-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Commit certified product output repair
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "Monderman-Group"
          git config user.email "jason.ivan.adamson@gmail.com"
          git add monderman-report.js sample-report.html scripts/meta_synthesis_frontend_fixture.mjs scripts/rebuild_sample_product_fidelity.py scripts/align_synthesis_fixture_terminology.py scripts/validate_sample_product_fidelity.py scripts/sample_product_fidelity_smoke.mjs
          git commit -m "Make Sample Reports product-faithful and enrich Synthesis reports [sample-fidelity-applied]"
          git push origin HEAD
