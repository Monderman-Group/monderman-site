name: Temporary Four Diagnostic Fidelity Audit

on:
  push:
    branches:
      - agent/four-diagnostic-sample-fidelity-2026-08-16

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/four-diagnostic-sample-fidelity-2026-08-16
      - name: Print diagnostic fidelity evidence
        shell: bash
        run: |
          set -euo pipefail
          for f in operational-systems.html decision-velocity.html structural-clarity.html institutional-performance.html; do
            echo "===== $f :: renderTrajectorySparkline ====="
            sed -n '/function renderTrajectorySparkline/,/^}/p' "$f" || true
            echo "===== $f :: trajectory/change labels ====="
            grep -n -E 'Trajectory|trajectory|Self-reported change|Change-pressure risk|longitudinal|predictive' "$f" | head -n 120 || true
          done
          echo "===== IP buildTrajectoryNarrative ====="
          sed -n '/function buildTrajectoryNarrative/,/^}/p' institutional-performance.html || true
          echo "===== IP benchmark labels ====="
          grep -n -E '>Benchmark<|Benchmark position|Against comparable|peer|design reference|Design reference' institutional-performance.html | head -n 120 || true
          echo "===== sample-report trajectory/change/provenance/economics ====="
          grep -n -E 'Trajectory|trajectory|Self-reported change|Change-pressure risk|scorer |config [0-9]|likely to continue|Operational creep|directional signal|31,500|5,500|2,000 annual|58,800|2\.9M|600,930|153,894|5,875,200|Where annual labor capacity goes|Against comparable institutions' sample-report.html || true
          echo "===== rebuild script references ====="
          grep -R -n --exclude-dir=.git 'rebuild_sample_product_fidelity.py' . || true
