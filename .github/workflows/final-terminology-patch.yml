name: Final customer terminology cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - 'final-terminology-patch.py'
      - '.github/workflows/final-terminology-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/final-release-retired-route-cleanup-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-release-retired-route-cleanup-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python final-terminology-patch.py
      - name: Verify frontend release
        run: |
          python scripts/validate_frontend_release.py
          git diff --check
      - name: Commit source repair
        run: |
          git config user.name 'Monderman Release Audit'
          git config user.email 'release-audit@users.noreply.github.com'
          git add index.html why-monderman.html scripts/validate_frontend_release.py
          git commit -m 'Normalize customer diagnostic terminology'
          git push origin HEAD:agent/final-release-retired-route-cleanup-20260819
