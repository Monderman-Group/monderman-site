name: One-shot prelaunch frontend hardening
on:
  push:
    branches: [agent/prelaunch-frontend-hardening]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prelaunch-frontend-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Apply deterministic frontend repairs
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          def edit(name, fn):
              p=root/name
              if not p.exists():
                  print('skip missing', name); return
              old=p.read_text(encoding='utf-8')
              new=fn(old)
              if new!=old:
                  p.write_text(new,encoding='utf-8')
                  print('edited',name)
          for name in [
            'decision-velocity-acceptance-harness.html','operational-systems-acceptance-harness.html',
            'structural-clarity-acceptance-harness.html','structural-clarity-acceptance-harness.js',
            'harness-qc-matrix.html','harness-security.html','harness-two-tenant.html']:
              p=root/name
              if p.exists(): p.unlink(); print('removed',name)
          for name,klass in [('index.html','book-jacket'),('research.html','bf-jacket')]:
              edit(name, lambda t,k=klass: re.sub(r'\s*<img class="'+re.escape(k)+r'"[^>]*src="book-jacket\.jpg"[^>]*/>','',t))
          edit('after-the-first-lap.html', lambda t: t.replace('https://www.monderman.com/after-the-first-lap.pdf','https://www.monderman.com/Monderman_Insight_After_the_First_Lap.pdf'))
          edit('privacy.html', lambda t: t.replace(
            "The public sample report and introductory material on this site are illustrative only. They do not ask you to identify yourself, do not involve your organization's data, and collect nothing about you.",
            "The public sample report and introductory material on this site are illustrative only. They do not ask you to submit identity, organizational, or diagnostic-response information. As with ordinary web use, hosting, security, and delivery providers may process basic connection and request information such as IP address, browser type, requested page, and time."
          ))
          edit('signin.html', lambda t: t.replace(
            'By continuing you agree to Monderman’s terms. We use your sign-in only to identify your workspace. See the <a href="privacy.html">privacy policy</a>.',
            'We use your sign-in to identify and secure your workspace. See the <a href="privacy.html">privacy policy</a>.'
          ))
          def security(t):
              t=t.replace(
                'Scoring, interpretation, and every write of a diagnostic result happen server-side: the API holds service-role credentials that the browser never sees, and no scoring logic or sector reference range is exposed to the client.',
                'Scoring, interpretation, and every write of a diagnostic result happen server-side: the API holds service-role credentials that the browser never sees, and scoring logic and source calibration tables remain server-side. After scoring, the API can return result-specific reference values needed for the browser to render that result; those presentation values are not credentials and do not grant database access.'
              )
              t=t.replace('The complete set of outside services involved:', 'Core outside services involved in operating the platform include:')
              t=t.replace(' and <strong>Cloudflare</strong> for bot verification before a diagnostic opens and for serving the script that builds your downloadable report.', ', <strong>Cloudflare</strong> for bot verification before a diagnostic opens and for serving report-building code, and public content-delivery networks for versioned browser libraries used by the site.')
              return t
          edit('security.html', security)
          def homepage(t):
              old='''<div class="cost-grid">\n<div class="cost-card reveal reveal-delay-1">\n<div class="cost-card-title">Time<span class="asterisk">*</span></div>\n<p class="cost-card-source"><em>* Harvard Business Review, 2016</em></p>\n<div class="cost-card-number" data-count-type="percent" data-target="40">0%</div>\n<p class="cost-card-text">of managers' time can be consumed by reports alone.</p>\n</div>\n<div class="cost-card reveal reveal-delay-2">\n<div class="cost-card-title">Money<span class="asterisk">*</span></div>\n<p class="cost-card-source"><em>* Gary Hamel &amp; Michele Zanini, HBR, 2018</em></p>\n<div class="cost-card-number" data-count-type="currency-trillion" data-target="3">$0T</div>\n<p class="cost-card-text">estimated annual cost of excess management in the U.S. economy.</p>\n</div>\n<div class="cost-card reveal reveal-delay-3">\n<div class="cost-card-title">Productive Capacity<span class="asterisk">*</span></div>\n<p class="cost-card-source"><em>* OECD administrative burden guidance, 2010s</em></p>\n<div class="cost-card-number" data-count-type="range-percent" data-target="30">—</div>\n<p class="cost-card-text">of productive capacity can be absorbed by administrative burden.</p>\n</div>\n</div>'''
              new='''<div class="cost-grid">\n<div class="cost-card reveal reveal-delay-1">\n<div class="cost-card-title">Evidence<span class="asterisk">*</span></div>\n<p class="cost-card-source"><em>* Hamel &amp; Zanini, HBR, 2017</em></p>\n<div class="cost-card-number" data-count-type="plain" data-target="7000">7,000+</div>\n<p class="cost-card-text">HBR readers contributed to a large survey of bureaucracy and bureaucratic drag.</p>\n</div>\n<div class="cost-card reveal reveal-delay-2">\n<div class="cost-card-title">Money<span class="asterisk">*</span></div>\n<p class="cost-card-source"><em>* Gary Hamel &amp; Michele Zanini, HBR, 2016</em></p>\n<div class="cost-card-number" data-count-type="currency-trillion" data-target="3">$0T</div>\n<p class="cost-card-text">estimated annual U.S. lost economic output attributed by the authors to excess bureaucracy.</p>\n</div>\n<div class="cost-card reveal reveal-delay-3">\n<div class="cost-card-title">Burden Reduction<span class="asterisk">*</span></div>\n<p class="cost-card-source"><em>* OECD Regulatory Policy Outlook, 2018</em></p>\n<div class="cost-card-number" data-count-type="percent" data-target="25">0%</div>\n<p class="cost-card-text">administrative-burden reduction target documented for the Netherlands' early Standard Cost Model program.</p>\n</div>\n</div>'''
              if old in t: t=t.replace(old,new)
              else: print('WARNING: homepage cost block did not match expected source')
              t=t.replace('Sources: Harvard Business Review reporting research (2016); Gary Hamel and Michele Zanini, Harvard Business Review (2018); OECD administrative burden guidance.',
                'Sources: Gary Hamel and Michele Zanini, Harvard Business Review (2016, 2017); OECD Regulatory Policy Outlook 2018. These are external reference points, not Monderman measurements.')
              t=t.replace('https://www.monderman.com/logo.png','https://www.monderman.com/favicon-192.png')
              return t
          edit('index.html', homepage)
          def refcopy(t):
              reps={
                'Benchmark and operating read':'Design reference and operating read',
                'Benchmark interpretation will appear here after scoring.':'Design-reference interpretation will appear here after scoring.',
                '<span class="accordion-title">Benchmark position</span>':'<span class="accordion-title">Design-reference position</span>',
                'Industry range, opportunity range, and directional trajectory.':'Instrument reference range, opportunity range, and directional trajectory.',
                '<h4>Industry positioning gauge</h4>':'<h4>Design-reference positioning gauge</h4>',
                '<span>Below range</span><span>Within range</span><span>Above range</span>':'<span>Below reference</span><span>Within reference</span><span>Above reference</span>',
                '<p class="summary-label">Benchmark</p>':'<p class="summary-label">Design reference</p>',
                '<span class="legend-dot dot-gold"></span>Comparable range':'<span class="legend-dot dot-gold"></span>Design reference',
                '<strong>Where you stand versus similar organizations — with room to lighten the load</strong>':'<strong>Where this result sits within the instrument’s sector-calibrated design reference</strong>',
                "Even sitting inside the comparable range, there's usually recoverable drag.":"Even within the design reference, there can still be recoverable drag.",
                '<p class="summary-sub tight" id="benchmarkSub">Similar-pathway context</p>':'<p class="summary-sub tight" id="benchmarkSub">Instrument calibration; not a peer benchmark.</p>',
                'Industry range comparison':'Design-reference position',
                'That means peer benchmarks will not create urgency by themselves; the case for change comes from trajectory, qualitative operating evidence, and recoverable capacity.':'The design reference is not itself evidence of peer performance; the case for change comes from trajectory, qualitative operating evidence, and recoverable capacity.'
              }
              for a,b in reps.items(): t=t.replace(a,b)
              return t
          edit('institutional-performance.html', refcopy)
          edit('operational-systems.html', refcopy)
          def sample(t):
              reps={
                'TYPICAL INDUSTRY RANGE':'DESIGN REFERENCE RANGE',
                'Below industry range':'Below design reference',
                'Within industry range':'Within design reference',
                'below industry range':'below design reference',
                'within industry range':'within design reference',
                'Below comparable range':'Below design reference',
                'below comparable range':'below design reference',
                'Against the industry range':'Against the instrument design reference',
                'the benchmark band':'the design-reference band',
                'A pathway can be normal for its sector':'A pathway can sit within its design reference',
                'The reading sits within industry range':'The reading sits within the design reference'
              }
              for a,b in reps.items(): t=t.replace(a,b)
              matches=list(re.finditer(r'<h1([^>]*)>(.*?)</h1>',t,flags=re.S|re.I))
              if len(matches)>1:
                  parts=[]; last=0
                  for n,m in enumerate(matches):
                      parts.append(t[last:m.start()])
                      parts.append(m.group(0) if n==0 else f'<h2{m.group(1)}>{m.group(2)}</h2>')
                      last=m.end()
                  parts.append(t[last:]); t=''.join(parts)
              t=re.sub(r'<select(?![^>]*(?:aria-label|aria-labelledby))([^>]*class="[^"]*(?:report|jump|mobile)[^"]*"[^>]*)>', r'<select aria-label="Jump to report section"\1>', t, flags=re.I)
              return t
          edit('sample-report.html', sample)
          # Remove the remaining stale benchmark label wherever it appears, including ROI output.
          for p in root.glob('*.html'):
              txt=p.read_text(encoding='utf-8',errors='ignore')
              new=txt.replace('TYPICAL INDUSTRY RANGE','DESIGN REFERENCE RANGE').replace('Typical industry range','Design reference range')
              if new!=txt:
                  p.write_text(new,encoding='utf-8')
                  print('normalized design reference',p.name)
          for p in root.glob('*.html'):
              txt=p.read_text(encoding='utf-8',errors='ignore')
              new=txt.replace('@supabase/supabase-js@2/+esm','@supabase/supabase-js@2.111.0/+esm')
              new=new.replace('@supabase/supabase-js@2"','@supabase/supabase-js@2.111.0"')
              new=new.replace('https://esm.sh/@supabase/supabase-js@2"','https://esm.sh/@supabase/supabase-js@2.111.0"')
              new=new.replace('https://cdn.jsdelivr.net/npm/chart.js"','https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"')
              if new!=txt: p.write_text(new,encoding='utf-8'); print('pinned deps',p.name)
          for p in root.glob('*.html'):
              if p.name.startswith('google'): continue
              t=p.read_text(encoding='utf-8',errors='ignore')
              title=re.search(r'<title>(.*?)</title>',t,re.S|re.I)
              desc=re.search(r'<meta\s+name="description"\s+content="([^"]*)"\s*/?>',t,re.I)
              url='https://www.monderman.com/' + ('' if p.name=='index.html' else p.name)
              additions=[]
              if 'rel="canonical"' not in t: additions.append(f'<link rel="canonical" href="{url}"/>')
              if 'property="og:title"' not in t and title: additions.append(f'<meta property="og:title" content="{re.sub(r"<[^>]+>","",title.group(1)).strip()}"/>')
              if 'property="og:type"' not in t: additions.append('<meta property="og:type" content="website"/>')
              if 'property="og:url"' not in t: additions.append(f'<meta property="og:url" content="{url}"/>')
              if 'property="og:description"' not in t and desc: additions.append(f'<meta property="og:description" content="{desc.group(1)}"/>')
              if additions:
                  t=t.replace('</title>','</title>\n'+'\n'.join(additions),1)
                  p.write_text(t,encoding='utf-8')
          (root/'robots.txt').write_text('User-agent: *\nAllow: /\nSitemap: https://www.monderman.com/sitemap.xml\n',encoding='utf-8')
          public=['','about.html','advisory-services.html','after-the-first-lap.html','connect.html','decision-velocity-article.html','designing-for-decision-velocity.html','deterministic-ai-infrastructure.html','diagnostics.html','governing-complexity.html','institutional-performance-article.html','operational-systems-article.html','platform-services.html','privacy.html','research.html','sample-report.html','security.html','structural-clarity-article.html','the-drift-problem.html','why-monderman.html']
          xml=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for x in public: xml.append(f'  <url><loc>https://www.monderman.com/{x}</loc></url>')
          xml.append('</urlset>')
          (root/'sitemap.xml').write_text('\n'.join(xml)+'\n',encoding='utf-8')
          (root/'sitemap.txt').write_text('\n'.join('https://www.monderman.com/'+x for x in public)+'\n',encoding='utf-8')
          from PIL import Image
          for name in ['Washington DC.jpg','Trees.jpg','Healthcare costs.jpg','Decision Velocity.jpg','Hero_Image.jpg','apature.jpg','iStock-2197579565.jpg']:
              p=root/name
              if not p.exists(): continue
              try:
                  im=Image.open(p).convert('RGB')
                  maxw=2200 if name=='Hero_Image.jpg' else 1800
                  if im.width>maxw:
                      h=round(im.height*maxw/im.width); im=im.resize((maxw,h),Image.Resampling.LANCZOS)
                  im.save(p,'JPEG',quality=82,optimize=True,progressive=True)
                  print('optimized',name,p.stat().st_size)
              except Exception as e: print('image warning',name,e)
          def lazy_home(t):
              def repl(m):
                  tag=m.group(0)
                  if 'hero-image' in tag or 'loading=' in tag: return tag
                  return tag[:-1]+' loading="lazy">'
              return re.sub(r'<img\b[^>]*>',repl,t,flags=re.I)
          edit('index.html',lazy_home)
          (root/'scripts').mkdir(exist_ok=True)
          (root/'scripts'/'validate_frontend_release.py').write_text('''from pathlib import Path\nimport sys\nr=Path('.')\nerrors=[]\nfor f in ["decision-velocity-acceptance-harness.html","operational-systems-acceptance-harness.html","structural-clarity-acceptance-harness.html","structural-clarity-acceptance-harness.js","harness-qc-matrix.html","harness-security.html","harness-two-tenant.html"]:\n    if (r/f).exists(): errors.append("public harness: "+f)\nfor p in r.glob("*.html"):\n    t=p.read_text(errors="ignore")\n    for s in ["book-jacket.jpg","collect nothing about you","agree to Monderman’s terms","Where you stand versus similar organizations","TYPICAL INDUSTRY RANGE","Similar-pathway context"]:\n        if s in t: errors.append(f"{p.name}: forbidden release string: {s}")\n    if not p.name.startswith("google") and 'rel="canonical"' not in t: errors.append(f"{p.name}: missing canonical")\nif not (r/'robots.txt').exists(): errors.append('missing robots.txt')\nif not (r/'sitemap.xml').exists(): errors.append('missing sitemap.xml')\nprint('frontend release errors:',len(errors))\nfor e in errors: print('ERROR',e)\nsys.exit(1 if errors else 0)\n''',encoding='utf-8')
          Path('.github/workflows/prelaunch-repair.yml').unlink(missing_ok=True)
      - name: Validate repaired release
        run: python scripts/validate_frontend_release.py
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden frontend for customer launch"
          git push origin HEAD:agent/prelaunch-frontend-hardening
