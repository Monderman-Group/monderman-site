name: One-shot Platform Brief v5 runner

on:
  push:
    branches: [main]
    paths:
      - scripts/platform_brief_v5_patch.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Platform Brief v5 patch
        run: python scripts/platform_brief_v5_patch.py
      - name: Validate frontend
        run: |
          git diff --check
          python scripts/validate_frontend_release.py
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('Monderman_Platform_Brief.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          Path('/tmp/platform-brief-v5.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/platform-brief-v5.js
      - name: Commit repair
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Monderman_Platform_Brief.html
          git diff --cached --check
          if git diff --cached --quiet; then echo "No page changes produced" >&2; exit 1; fi
          git commit -m "Stabilize Platform Brief links and economics"
          git push origin HEAD:main
