name: Marketing visual review
on:
  push:
    branches: [codex/marketing-photography-refresh-20261012]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source for isolated review
        run: tar --exclude=.git -czf /tmp/marketing-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-review-source
          path: /tmp/marketing-source.tgz
          retention-days: 3
