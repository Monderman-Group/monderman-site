name: Inspect Operational Systems output integrity

on:
  push:
    branches: [agent/os-output-integrity-2026-08-13]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate capacity and report-integrity anchors
        run: |
          set -euo pipefail
          grep -n -E 'renderCapacityWaterfall|estimatedAdminLoad|capacityWaterfall|Capacity allocation|necessary administrative load|productive work' operational-systems.html || true
          grep -n -E 'function runChecks|const unsupportedClaim|const claimSectionKeys|Harness build 2026-08-13' operational-systems-acceptance-harness.html || true
