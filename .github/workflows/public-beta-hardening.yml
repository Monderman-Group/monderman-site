# Temporary release workflow. Remove before merge.
name: Public beta hardening
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-beta-hardening.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply public beta copy and disclosure repairs
        run: python scripts/public_beta_hardening_20260819.py
      - name: Run frontend release validation
        run: python scripts/validate_frontend_release.py
      - name: Run diagnostic inline validation
        run: python scripts/validate_diagnostic_inline_js.py
      - name: Verify no stale trial scope or report beta stamps
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eqi 'one (Pattern )?trial per Workspace' pattern-trial.html plan-pattern.html
          grep -Fq 'one-time Pattern-trial anti-abuse record' privacy.html
          grep -Fq 'ordinary Diagnostics require a signed-in member session' security.html
          grep -Fq 'ws-beta-release' workspace.html
          ! grep -Eqi '>Beta<|Public Beta|beta release' sample-report.html monderman-report.js decision-velocity.html structural-clarity.html operational-systems.html institutional-performance.html
      - name: Commit generated release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Monderman-Group'
          git config user.email 'jason.ivan.adamson@gmail.com'
          git add privacy.html security.html pattern-trial.html plan-pattern.html workspace.html workspace-diagnostics.html workspace-analysis.html workspace-actions.html workspace-settings.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Harden public beta disclosures and labels'
          git push origin HEAD:${GITHUB_HEAD_REF}
