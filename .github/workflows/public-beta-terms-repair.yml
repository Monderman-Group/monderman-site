name: Public beta terms repair
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-beta-terms-repair.yml'
permissions:
  contents: write
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply terms wiring
        run: python scripts/patch_public_beta_terms_20260819.py
      - name: Run frontend release gate
        run: python scripts/validate_frontend_release.py
      - name: Run diagnostic inline validation
        run: python scripts/validate_diagnostic_inline_js.py
      - name: Check diff
        run: git diff --check
      - name: Commit customer-facing files and permanent guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Monderman-Group'
          git config user.email 'jason.ivan.adamson@gmail.com'
          git add pattern-trial.html signin.html privacy.html security.html sitemap.xml sitemap.txt scripts/validate_frontend_release.py
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Wire public beta terms into customer acceptance'
          git push origin HEAD:${GITHUB_HEAD_REF}
