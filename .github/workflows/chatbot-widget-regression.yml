name: Bounded chatbot widget regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify local-only conversations, access boundaries and responsive controls
        run: |
          node scripts/chatbot_widget_browser_smoke.mjs
          node scripts/chatbot_site_layout_smoke.mjs
