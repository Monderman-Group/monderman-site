name: Bounded chatbot widget regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify local-only conversations, access boundaries and responsive controls
        run: |
          node scripts/chatbot_widget_browser_smoke.mjs
          node scripts/chatbot_site_layout_smoke.mjs
      - name: Verify restored floating controls and shared footer on every public page
        run: |
          MONDERMAN_QUESTIONNAIRE_RELEASE=current RENDER_GIT_COMMIT="${{ github.sha }}" bash scripts/render-static-build.sh
          node scripts/footer_support_smoke.mjs
          FOOTER_FULL_SCRIPTS=1 FOOTER_TEST_OUTPUT=output/full-script-support node scripts/footer_support_smoke.mjs
      - name: Keep floating controls clear of animations and late content
        run: |
          python3 -m http.server 8080 --directory .render-public > /tmp/floating-widget-http.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/connect.html -o /dev/null; then break; fi
            sleep 0.2
          done
          node scripts/floating_widget_motion_smoke.mjs
