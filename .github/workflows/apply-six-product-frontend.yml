name: Apply six-product frontend ecosystem

on:
  push:
    branches: [agent/six-product-ecosystem-frontend-2026-08-16-v1]

permissions:
  contents: write

concurrency:
  group: apply-six-product-frontend-2026-08-16-v1
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[frontend applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and apply exact frontend patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'a6d58cf1ec7e576b47daca8330234e80ea17a835a78ced9d8e58705914652752  scripts/site-ecosystem.patch.gz.b64.00a' | sha256sum --check
          echo '018c5add5c94fe181a48e203822820589d356bfe8d0465486f0cfe2e308d3842  scripts/site-ecosystem.patch.gz.b64.00b' | sha256sum --check
          echo '2b02186867b4759f415f1ebb1a2f7dd74ca0b937a811b4bf07f1dd74dc8e2c0e  scripts/site-ecosystem.patch.gz.b64.00c' | sha256sum --check
          echo '818fb4587b9a2b1e83a1fca5e960e4acbc0342ce002812827fc72ead8ed0d065  scripts/site-ecosystem.patch.gz.b64.01' | sha256sum --check
          echo '1bfce46e25e8bbd06e16caf2960b621051192876de952237423e71ed893b3a0a  scripts/site-ecosystem.patch.gz.b64.02' | sha256sum --check
          echo '2f07b93d1f75b2bc39018dcb7fb3945d61fbf30e5217508b238f4bc93de50d2a  scripts/site-ecosystem.patch.gz.b64.03' | sha256sum --check
          echo 'c3c8f79670116990966caea4ccb81b02cb065cb1c685592aa26aaaed1c3ff03e  scripts/site-ecosystem.patch.gz.b64.04' | sha256sum --check
          echo '40cd3feed6ee5b64e8cdd2003c29df5211345540e271514dac95857d4ac38566  scripts/site-ecosystem.patch.gz.b64.05' | sha256sum --check
          echo '9f03f559b2499943175d1eeb7a41c35038ea0daec89b7548506834b680ba04af  scripts/site-ecosystem.patch.gz.b64.06' | sha256sum --check
          echo '709b7a849d6895b4a16780cda4a0907d18f26e09fbca13f2e4f320de7b2d2bd6  scripts/site-ecosystem.patch.gz.b64.07' | sha256sum --check
          echo 'cc125a7fe0589980ab6e3ee31940fd78172391eef3b624cde60efbca05131e1d  scripts/site-ecosystem.patch.gz.b64.08' | sha256sum --check
          echo '16f78b202f4b4e0f0e04a537faf92b21901227b85f5a3e2be2fad8ce0d724c86  scripts/site-ecosystem.patch.gz.b64.09' | sha256sum --check
          echo '32db2f911f370d40cbbd47fb67e99d6fe0e8361d52b8e5efb7e8b97843b492bc  scripts/site-ecosystem.patch.gz.b64.10' | sha256sum --check
          echo '160b372416e56bc587d67fdc65ba8794e83fa7098f3d78a280d08b52bbb77e7d  scripts/site-ecosystem.patch.gz.b64.11' | sha256sum --check
          cat \
            scripts/site-ecosystem.patch.gz.b64.00a \
            scripts/site-ecosystem.patch.gz.b64.00b \
            scripts/site-ecosystem.patch.gz.b64.00c \
            scripts/site-ecosystem.patch.gz.b64.01 \
            scripts/site-ecosystem.patch.gz.b64.02 \
            scripts/site-ecosystem.patch.gz.b64.03 \
            scripts/site-ecosystem.patch.gz.b64.04 \
            scripts/site-ecosystem.patch.gz.b64.05 \
            scripts/site-ecosystem.patch.gz.b64.06 \
            scripts/site-ecosystem.patch.gz.b64.07 \
            scripts/site-ecosystem.patch.gz.b64.08 \
            scripts/site-ecosystem.patch.gz.b64.09 \
            scripts/site-ecosystem.patch.gz.b64.10 \
            scripts/site-ecosystem.patch.gz.b64.11 \
            | base64 --decode > /tmp/site.patch.gz
          echo 'da9e9d1c094371404042720b6e6363b1abf50b322192e48276af18c047bd9425  /tmp/site.patch.gz' | sha256sum --check
          gzip -dc /tmp/site.patch.gz > /tmp/site.patch
          echo '1f3d2425b05cd631e066063ffd08b7db7b16e73c08bb8d02dd232f2f89da1f28  /tmp/site.patch' | sha256sum --check
          git apply --check /tmp/site.patch
          git apply /tmp/site.patch
          rm -f scripts/site-ecosystem.patch.gz.b64.*

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_frontend_release.py
          python scripts/validate_meta_synthesis_frontend.py
          python scripts/validate_six_product_ecosystem.py
          node scripts/meta_synthesis_frontend_fixture.mjs
          git diff --check

      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Monderman-Group'
          git config user.email 'jason.ivan.adamson@gmail.com'
          git add -A
          git commit -m 'Integrate six-product frontend ecosystem [frontend applied]'
          git push origin HEAD
