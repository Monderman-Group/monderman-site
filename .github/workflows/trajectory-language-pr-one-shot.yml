name: One-shot PR trajectory language repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/trajectory-language-consistency-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trajectory-language-consistency-20260817
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded repair
        run: python .github/trajectory_language_repair.py

      - name: Validate before writing commit
        shell: bash
        run: |
          set -euo pipefail
          node --check monderman-report.js
          node --check scripts/sample_product_fidelity_smoke.mjs
          python scripts/validate_sample_product_fidelity.py
          python scripts/validate_frontend_release.py
          git diff --check

      - name: Commit repaired files and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/trajectory_language_repair.py \
            .github/workflows/trajectory-language-one-shot.yml \
            .github/workflows/trajectory-language-pr-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operational-systems.html decision-velocity.html institutional-performance.html \
            monderman-report.js sample-report.html \
            scripts/validate_sample_product_fidelity.py scripts/sample_product_fidelity_smoke.mjs
          git diff --cached --check
          git commit -m "Normalize customer-facing trajectory direction language"
          git push origin HEAD:agent/trajectory-language-consistency-20260817
