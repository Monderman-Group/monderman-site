name: One-shot homepage hero Platform Brief CTA

on:
  push:
    branches: [main]
    paths:
      - scripts/home_hero_platform_brief_patch.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply homepage hero CTA patch
        run: python scripts/home_hero_platform_brief_patch.py
      - name: Validate frontend
        run: |
          git diff --check
          python scripts/validate_frontend_release.py
      - name: Commit repair
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git diff --cached --check
          if git diff --cached --quiet; then echo "No homepage changes produced" >&2; exit 1; fi
          git commit -m "Add Platform Brief homepage hero CTA"
          git push origin HEAD:main
