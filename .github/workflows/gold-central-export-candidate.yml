name: Generate gold and Central-chart review candidate
on:
  push:
    branches: [codex/gold-central-sankey-20260920]
    paths:
      - monderman-report.js
      - scripts/export_synthesis_sample_pdfs.mjs
      - scripts/review_synthesis_pdf_pages.py
      - .github/workflows/gold-central-export-candidate.yml
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/gold-central-sankey-20260920
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          bash scripts/install_ci_browsers.sh
          python -m pip install --disable-pip-version-check pypdf==6.10.0 pymupdf==1.26.7 pillow==11.3.0
      - name: Test unchanged scenarios and Central-only print selection
        env:
          REPORT_THREE_BENEFIT_OUT: /tmp/gold-central-layout
        run: node scripts/report_three_benefit_smoke.mjs
      - name: Check built-site gold in Chromium and WebKit
        env:
          RENDER_GIT_COMMIT: ${{ github.sha }}
          MONDERMAN_QUESTIONNAIRE_RELEASE: current
          GOLD_ACCENT_OUT: /tmp/gold-central-accents
          SITE_BASE: http://127.0.0.1:4175
        run: |
          bash scripts/render-static-build.sh
          python -m http.server 4175 --directory .render-public >/tmp/gold-site-server.log 2>&1 &
          site_server_pid=$!
          trap 'kill "$site_server_pid"' EXIT
          node scripts/public_gold_accent_smoke.mjs
      - name: Generate the two sample PDFs and review all pages
        run: |
          node scripts/export_synthesis_sample_pdfs.mjs /tmp/gold-central-exports
          python scripts/review_synthesis_pdf_pages.py /tmp/gold-central-exports
      - name: Preserve candidate exports for human visual review
        run: |
          mkdir -p test-fixtures/gold-central-review
          cp /tmp/gold-central-exports/depth_synthesis.pdf sample-data/reports/depth_synthesis.pdf
          cp /tmp/gold-central-exports/cross_lens_synthesis.pdf sample-data/reports/cross_lens_synthesis.pdf
          cp /tmp/gold-central-exports/EXPORT-CHECKS.json test-fixtures/gold-central-review/
          cp /tmp/gold-central-exports/page-review/PDF-CHECKS.json test-fixtures/gold-central-review/
          cp /tmp/gold-central-exports/page-review/*contact*.png test-fixtures/gold-central-review/
          cp /tmp/gold-central-exports/page-review/*-0[1-4].png test-fixtures/gold-central-review/
          cp /tmp/gold-central-accents/checks.json test-fixtures/gold-central-review/GOLD-CHECKS.json
          cp /tmp/gold-central-accents/chromium-*-home-hero.png test-fixtures/gold-central-review/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample-data/reports/depth_synthesis.pdf sample-data/reports/cross_lens_synthesis.pdf test-fixtures/gold-central-review
          git diff --cached --quiet || git commit -m 'Generate Central-only synthesis PDF candidates for review'
          git push origin HEAD:codex/gold-central-sankey-20260920
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-central-candidate
          path: |
            /tmp/gold-central-layout
            /tmp/gold-central-exports
            /tmp/gold-central-accents
          retention-days: 7
