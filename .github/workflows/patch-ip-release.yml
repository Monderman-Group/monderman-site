name: Patch Institutional Performance frontend release

on:
  push:
    branches: [agent/ip-release-candidate-2026-08-14-v3]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Institutional Performance frontend repair
        run: python scripts/patch-ip-release.py

      - name: Validate production page and temporary acceptance harness
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for source in ["institutional-performance.html", "institutional-performance-acceptance-harness.html"]:
              text = Path(source).read_text()
              for index, match in enumerate(re.finditer(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text, re.I)):
                  body = match.group(1)
                  if body.strip() and "src=" not in match.group(0).lower():
                      path = Path(f"/tmp/{Path(source).stem}-{index}.js")
                      path.write_text(body)
          PY
          for f in /tmp/institutional-performance-*.js; do node --check "$f"; done
          python scripts/validate_ip_output_integrity.py
          python scripts/validate_frontend_release.py || true
          git diff --check

      - name: Commit production repair and temporary harness
        run: |
          if git diff --quiet -- institutional-performance.html institutional-performance-acceptance-harness.html scripts/validate_ip_output_integrity.py; then
            echo 'Repair already applied.'
            exit 0
          fi
          git config user.name 'Monderman-Group'
          git config user.email 'jason.ivan.adamson@gmail.com'
          git add institutional-performance.html institutional-performance-acceptance-harness.html scripts/validate_ip_output_integrity.py
          git commit -m 'Harden Institutional Performance reports and acceptance gate'
          git push origin HEAD
