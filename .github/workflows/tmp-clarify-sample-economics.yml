name: Temporary sample economics clarification

on:
  push:
    branches:
      - agent/four-diagnostic-sample-fidelity-2026-08-16

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/four-diagnostic-sample-fidelity-2026-08-16
          fetch-depth: 0
      - name: Clarify sample economics formulas
        run: python3 scripts/tmp_clarify_sample_economics.py
      - name: Validate sample contracts
        run: |
          python3 scripts/validate_sample_product_fidelity.py
          python3 scripts/validate_report_presentation.py
      - name: Commit clarification
        shell: bash
        run: |
          git config user.name "Monderman-Group"
          git config user.email "jason.ivan.adamson@gmail.com"
          git add sample-report.html
          git commit -m "Clarify Diagnostic sample economics formulas"
          git push origin HEAD:agent/four-diagnostic-sample-fidelity-2026-08-16
