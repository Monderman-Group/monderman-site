name: One-shot tag Monderman v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-launch-v1.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Tag certified site product baseline
        shell: bash
        run: |
          set -euo pipefail
          target='1cfcef3b3f8c5df9496ce902e2e5a1ae0ba2f0b4'
          git config user.name 'Monderman-Group'
          git config user.email 'jason.ivan.adamson@gmail.com'
          git fetch --tags origin
          if git show-ref --verify --quiet refs/tags/v1.0.0; then
            existing=$(git rev-list -n 1 v1.0.0)
            [[ "$existing" == "$target" ]] || { echo "v1.0.0 exists at $existing, expected $target"; exit 1; }
            echo "v1.0.0 already points to certified baseline."
          else
            git cat-file -e "$target^{commit}"
            git tag -a v1.0.0 "$target" -m 'Monderman v1.0.0 customer-launch baseline — certified 2026-08-17'
            git push origin refs/tags/v1.0.0
          fi
