name: Byte-level report repair

on:
  push:
    branches:
      - agent/sample-report-byte-level-repair-2026-08-16

permissions:
  contents: write

concurrency:
  group: byte-level-report-repair-2026-08-16
  cancel-in-progress: true

jobs:
  repair-and-certify:
    if: ${{ !contains(github.event.head_commit.message, '[byte-report-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply or refine byte-level report repair
        shell: bash
        run: |
          if grep -q 'const crossLensMapped = m.product === "cross_lens";' monderman-report.js; then
            echo "Byte-level report repair already applied and refined."
          elif grep -q 'function renderCrossLensEvidenceMap' monderman-report.js; then
            python scripts/byte_level_report_refine.py
          else
            python scripts/byte_level_report_repair.py
          fi

      - name: Static and existing release gates
        run: |
          node --check monderman-report.js
          python scripts/validate_report_presentation.py
          python scripts/validate_frontend_release.py
          python scripts/validate_six_product_ecosystem.py
          python scripts/validate_meta_synthesis_frontend.py
          python scripts/validate_sample_product_fidelity.py

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve candidate
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/byte-report-http.log 2>&1 &
          echo $! >/tmp/byte-report-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/sample-report.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/byte-report-http.log
          exit 1

      - name: Render acceptance corpus
        env:
          REPORT_OUT: /tmp/byte-report-smoke
        run: node scripts/report_presentation_smoke.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byte-level-report-rendered-evidence-final
          path: /tmp/byte-report-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Commit certified final repair
        run: |
          if git diff --quiet -- monderman-report.js; then
            echo "No generated renderer changes to commit"
            exit 0
          fi
          git config user.name "Monderman-Group"
          git config user.email "jason.ivan.adamson@gmail.com"
          git add monderman-report.js
          git commit -m "Finalize Synthesis report evidence presentation [byte-report-final]"
          git push origin HEAD
