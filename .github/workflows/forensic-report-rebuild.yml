name: Forensic report rebuild

on:
  push:
    branches:
      - agent/sample-report-forensic-rebuild-2026-08-16

permissions:
  contents: write

concurrency:
  group: forensic-report-rebuild-2026-08-16
  cancel-in-progress: true

jobs:
  rebuild-and-certify:
    if: ${{ !contains(github.event.head_commit.message, '[forensic-report-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply forensic report rebuild
        run: |
          python scripts/forensic_report_rebuild.py
          python scripts/normalize_forensic_score_contract.py

      - name: Static and existing release gates
        run: |
          node --check monderman-report.js
          python scripts/validate_forensic_report_rebuild.py
          python scripts/validate_frontend_release.py
          python scripts/validate_six_product_ecosystem.py
          python scripts/validate_meta_synthesis_frontend.py
          python scripts/validate_sample_product_fidelity.py

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve candidate
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/forensic-report-http.log 2>&1 &
          echo $! >/tmp/forensic-report-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/sample-report.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/forensic-report-http.log
          exit 1

      - name: Render forensic acceptance corpus
        env:
          REPORT_OUT: /tmp/forensic-report-smoke
        run: node scripts/forensic_report_smoke.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-report-rendered-evidence
          path: /tmp/forensic-report-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Commit certified rebuild
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "Monderman-Group"
          git config user.email "jason.ivan.adamson@gmail.com"
          git add monderman-report.js sample-report.html
          git commit -m "Forensically rebuild Executive Report presentation [forensic-report-applied]"
          git push origin HEAD
