name: Temporary PR53 IP syntax repair

on:
  push:
    branches:
      - agent/four-diagnostic-sample-fidelity-2026-08-16

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/four-diagnostic-sample-fidelity-2026-08-16
          fetch-depth: 0
      - name: Remove duplicated Institutional Performance narrative tail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("institutional-performance.html")
          s = p.read_text(encoding="utf-8")
          old = (
              '  } else if (direction === "down") {\n'
              '  return "The trajectory signal suggests some pressure may be easing. Verify that with measurement before assuming the problem is self-correcting; perceived improvement and structural improvement are not the same.";\n'
              '  } else {\n'
              '  return "The trajectory signal suggests relative stability. Stability here should not be confused with strength — a structure that looks stable can still be carrying real cost that people have simply gotten used to.";\n'
              '  }\n'
          )
          if old not in s:
              raise SystemExit("expected duplicated trajectory tail not found")
          p.write_text(s.replace(old, "", 1), encoding="utf-8")
          PY
      - name: Validate all Diagnostic inline JavaScript
        run: python scripts/validate_diagnostic_inline_js.py
      - name: Commit syntax repair
        shell: bash
        run: |
          git config user.name "Monderman-Group"
          git config user.email "jason.ivan.adamson@gmail.com"
          git add institutional-performance.html
          git commit -m "Fix Institutional Performance narrative syntax"
          git push origin HEAD:agent/four-diagnostic-sample-fidelity-2026-08-16
