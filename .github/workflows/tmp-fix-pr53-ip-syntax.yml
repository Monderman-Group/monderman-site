name: Temporary PR53 IP syntax repair

on:
  push:
    branches:
      - agent/four-diagnostic-sample-fidelity-2026-08-16

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[fix-ip-syntax]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/four-diagnostic-sample-fidelity-2026-08-16
          fetch-depth: 0
      - name: Remove duplicated Institutional Performance narrative tail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('institutional-performance.html')
          s = p.read_text(encoding='utf-8')
          stale = '''  } else if (direction === "down") {
  return "The trajectory signal suggests some pressure may be easing. Verify that with measurement before assuming the problem is self-correcting; perceived improvement and structural improvement are not the same.";
  } else {
  return "The trajectory signal suggests relative stability. Stability here should not be confused with strength — a structure that looks stable can still be carrying real cost that people have simply gotten used to.";
  }
'''
          if stale not in s:
              raise SystemExit('expected duplicated trajectory tail not found')
          s = s.replace(stale, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate all Diagnostic inline JavaScript
        run: python scripts/validate_diagnostic_inline_js.py
      - name: Commit syntax repair
        run: |
          git config user.name "Monderman-Group"
          git config user.email "jason.ivan.adamson@gmail.com"
          git add institutional-performance.html
          git commit -m "Fix Institutional Performance narrative syntax [fix-ip-syntax]"
          git push origin HEAD:agent/four-diagnostic-sample-fidelity-2026-08-16
