name: Outreach compatibility audit
on:
  push:
    branches: [outreach-response-20261005]
    paths: ['.github/workflows/outreach-compatibility-audit.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact source and historical objects for compatibility testing
        shell: bash
        run: |
          set -euo pipefail
          git bundle create outreach-site-source.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: outreach-source-compatibility
          path: outreach-site-source.bundle
          retention-days: 1
