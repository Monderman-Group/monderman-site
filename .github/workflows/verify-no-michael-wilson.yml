name: Verify Michael Wilson removal

on:
  push:
    branches:
      - cleanup/remove-michael-wilson

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'PyMuPDF>=1.24,<2'
      - name: Scan all current HTML and PDFs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import pymupdf

          patterns = [
              re.compile(r'michael\s+wilson', re.I),
              re.compile(r'founder-michael-wilson', re.I),
              re.compile(r'siteshadow', re.I),
          ]
          hits = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              for pat in patterns:
                  if pat.search(text):
                      hits.append(f'HTML {path}: {pat.pattern}')

          for path in Path('.').rglob('*.pdf'):
              try:
                  doc = pymupdf.open(path)
              except Exception as exc:
                  hits.append(f'PDF {path}: could not inspect ({exc})')
                  continue
              text = '\n'.join(page.get_text() for page in doc)
              meta = ' '.join(str(v or '') for v in (doc.metadata or {}).values())
              doc.close()
              haystack = text + '\n' + meta
              for pat in patterns:
                  if pat.search(haystack):
                      hits.append(f'PDF {path}: {pat.pattern}')

          if hits:
              print('\n'.join(hits))
              raise SystemExit(1)
          print('PASS: no Michael Wilson / SiteShadow references in current main HTML or PDFs')
          PY
