name: Fix reclaim disclosure acceptance check

on:
  push:
    branches: [agent/os-output-integrity-2026-08-13]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify acceptance alignment
        run: |
          python scripts/fix-reclaim-disclosure-check.py
          python scripts/validate_os_output_integrity.py
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('operational-systems-acceptance-harness.html').read_text()
          match = re.search(r'<script>\s*(.*?)\s*</script>\s*</body>', text, re.S)
          if not match:
              raise SystemExit('Could not extract harness JavaScript')
          Path('/tmp/os-acceptance.mjs').write_text(match.group(1))
          PY
          node --check /tmp/os-acceptance.mjs
          git diff --check
      - name: Commit alignment
        run: |
          if git diff --quiet; then
            echo 'Acceptance check already aligned.'
            exit 0
          fi
          git config user.name 'Monderman-Group'
          git config user.email 'jason.ivan.adamson@gmail.com'
          git add operational-systems-acceptance-harness.html scripts/validate_os_output_integrity.py
          git commit -m 'Align reclaim disclosure acceptance check'
          git push origin HEAD
