name: Customer-facing lexicon repair

on:
  push:
    branches:
      - agent/customer-lexicon-sample-reports-2026-08-16-v1

permissions:
  contents: write

concurrency:
  group: customer-lexicon-repair-2026-08-16
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[lexicon-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply customer-facing lexicon and sample-report repair
        run: python scripts/customer_lexicon_repair.py
      - name: Run existing frontend validators
        run: |
          python scripts/validate_frontend_release.py
          python scripts/validate_six_product_ecosystem.py
          python scripts/validate_meta_synthesis_frontend.py
      - name: Customer-visible forbidden-term sweep
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, sys
          class Visible(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag in {'script','style','template'}: self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'script','style','template'} and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)
          forbidden = {
              'seat': re.compile(r'\bseat(?:s|-year)?\b', re.I),
              'insight depth': re.compile(r'\binsight depth\b', re.I),
              'executive perspective': re.compile(r'\bexecutive perspective\b', re.I),
              'executive-seat': re.compile(r'\bexecutive-seat\b', re.I),
              'cross-diagnostic synthesis': re.compile(r'\bcross-diagnostic synthesis\b', re.I),
              'meta-diagnostic': re.compile(r'\bmeta-diagnostic(?:s)?\b', re.I),
              'expert help': re.compile(r'\bexpert help\b', re.I),
              'per employee pricing': re.compile(r'\bper[- ]employee\b', re.I),
              'unlimited people': re.compile(r'\bunlimited people\b', re.I),
          }
          failures=[]
          for p in Path('.').glob('*.html'):
              h=Visible(); h.feed(p.read_text(encoding='utf-8', errors='ignore'))
              visible=' '.join(h.parts)
              for label, pat in forbidden.items():
                  m=pat.search(visible)
                  if m: failures.append(f'{p}: {label}: {m.group(0)}')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('CUSTOMER_VISIBLE_LEXICON_SWEEP_PASS')
          PY
      - name: Commit repaired customer copy
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Monderman-Group"
          git config user.email "jason.ivan.adamson@gmail.com"
          git add '*.html' scripts/customer_lexicon_repair.py
          git commit -m "Align customer lexicon and sample reports [lexicon-applied]"
          git push origin HEAD
