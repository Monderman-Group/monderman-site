name: Temporary exact native Connect diagnostic
on:
  push:
    branches: [codex/divide-and-rule-20261025]
    paths:
      - 'scripts/connect_submit_native_diagnostic.mjs'
      - '.github/workflows/connect-submit-native-diagnostic.yml'
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          bash scripts/install_ci_browsers.sh
      - name: Build actual compiled site
        env:
          RENDER_GIT_COMMIT: ${{ github.sha }}
          MONDERMAN_QUESTIONNAIRE_RELEASE: current
        run: bash scripts/render-static-build.sh
      - name: Observe original WebKit case without changing its actions
        run: |
          python -m http.server 8080 --directory .render-public >/tmp/connect-diagnostic-http.log 2>&1 &
          for readiness_attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8080/connect.html >/dev/null && break
            sleep 1
          done
          node scripts/connect_submit_native_diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-connect-native-diagnostic
          path: output/connect-native-diagnostic
