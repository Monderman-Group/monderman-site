name: Protected Pages deployment

on:
  workflow_run:
    workflows: ["Sample and Executive Report certification"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require successful frontend gate for the exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in {1..40}; do
            conclusion="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/frontend-release.yml/runs"               -f head_sha="${HEAD_SHA}" -f event=push -f per_page=10               --jq '.workflow_runs[0].conclusion // empty')"
            if [ "$conclusion" = "success" ]; then
              exit 0
            fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "timed_out" ]; then
              echo "Frontend release gate concluded: $conclusion"
              exit 1
            fi
            sleep 15
          done
          echo "Frontend release gate did not complete successfully for $HEAD_SHA"
          exit 1
      - name: Check out the exact doubly validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
