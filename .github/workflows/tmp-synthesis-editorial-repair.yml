name: Temporary Synthesis Editorial Repair

on:
  push:
    branches:
      - agent/synthesis-editorial-report-family

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/synthesis-editorial-report-family
          fetch-depth: 0

      - name: Apply editorial report-family patch
        shell: bash
        run: |
          if grep -q "mr-editorial-row" monderman-report.js; then
            echo "Editorial patch already present."
            exit 0
          fi
          python3 scripts/tmp_apply_synthesis_editorial.py

      - name: Validate patch
        shell: bash
        run: |
          node --check monderman-report.js
          python3 scripts/validate_report_presentation.py
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No renderer changes to commit."
            exit 0
          fi
          git config user.name "Monderman Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add monderman-report.js scripts/validate_report_presentation.py
          git commit -m "Align Synthesis reports with editorial report family"
          git push origin HEAD:agent/synthesis-editorial-report-family
