name: Temporary site launch blocker patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-launch-blocker-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-blocker-hardening-20260818
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded patch
        run: python scripts/temporary_launch_blocker_patch.py

      - name: Targeted validation
        run: |
          set -euo pipefail
          python scripts/validate_meta_synthesis_frontend.py
          python scripts/validate_frontend_release.py
          git diff --check

      - name: Commit guarded product patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace-diagnostics.html workspace-analysis.html workspace.html workspace-actions.html diagnostics.html scripts/validate_meta_synthesis_frontend.py
          git diff --cached --quiet && { echo "No product patch changes produced"; exit 1; }
          git commit -m "Enforce reviewed Included workspace sources"
          git push origin HEAD:agent/launch-blocker-hardening-20260818

# Temporary: removed before merge. Permanent workflow changes are committed separately.
