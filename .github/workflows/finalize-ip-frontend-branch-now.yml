name: Finalize certified Institutional Performance frontend branch

on:
  push:
    branches: [agent/ip-customer-release-gate-2026-08-14]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply repair if one-shot patcher remains
        run: |
          if [ -f scripts/patch-ip-customer-release-v2.py ]; then
            python scripts/patch-ip-customer-release-v2.py
          elif [ -f scripts/patch-ip-customer-release.py ]; then
            python scripts/patch-ip-customer-release.py
          fi

      - name: Prove production file differs from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD; git diff --name-only)"
          printf '%s\n' "$changed" | sort -u
          printf '%s\n' "$changed" | grep -Fxq institutional-performance.html || {
            echo 'institutional-performance.html has no production delta.' >&2
            exit 1
          }

      - name: Run complete frontend certification
        run: |
          python scripts/validate_frontend_release.py
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('institutional-performance.html').read_text()
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/ip-inline-{i}.mjs').write_text(block)
          PY
          for f in /tmp/ip-inline-*.mjs; do node --check "$f"; done
          git diff --check

      - name: Remove one-shot machinery and record certification
        run: |
          rm -f scripts/patch-ip-customer-release.py
          rm -f scripts/patch-ip-customer-release-v2.py
          rm -f .github/workflows/certify-ip-frontend-branch.yml
          rm -f .github/workflows/run-ip-frontend-patch-now.yml
          rm -f .github/workflows/finalize-ip-frontend-branch-now.yml
          cat > IP_FRONTEND_BRANCH_CERTIFIED.md <<'EOF'
          Institutional Performance frontend branch certification passed:
          - production report page changed
          - frontend release validator passed
          - inline JavaScript syntax checks passed
          - diff checks passed
          EOF

      - name: Commit finalized branch
        run: |
          git config user.name 'Monderman-Group'
          git config user.email 'jason.ivan.adamson@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization delta.'
          else
            git commit -m 'Finalize Institutional Performance frontend release gate'
            git push origin HEAD
          fi
