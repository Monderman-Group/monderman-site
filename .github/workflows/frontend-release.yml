  saved-synthesis-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          bash scripts/install_ci_browsers.sh
      - name: Verify saved personal and campaign reports with synthetic API responses
        env:
          SAVED_SYNTHESIS_OUT: ${{ runner.temp }}/saved-synthesis-page
        run: node scripts/saved_synthesis_page_smoke.mjs
      - name: Verify future-interest careers form with synthetic services only
        run: node scripts/careers_frontend_smoke.mjs
      - name: Verify the sample PDF button exports only the selected report
        run: node scripts/sample_selected_pdf_route_smoke.mjs --output=${{ runner.temp }}/sample-selected-pdf
      - name: Keep sample report navigation below the settled site header
        env:
          SAMPLE_HEADER_OUT: ${{ runner.temp }}/sample-header-offset
        run: |
          RENDER_GIT_COMMIT="${{ github.sha }}" bash scripts/render-static-build.sh
          node scripts/sample_header_offset_smoke.mjs
      - name: Verify purchase-confirmation refresh and user/Workspace binding with synthetic responses
        env:
          CHECKOUT_RECOVERY_OUT: ${{ runner.temp }}/checkout-success-recovery
        run: node scripts/checkout_success_recovery_smoke.mjs
      - name: Verify server-dated evaluation status across Workspace layouts
        env:
          EVALUATION_UI_OUT: ${{ runner.temp }}/evaluation-countdown
        run: node scripts/workspace_evaluation_countdown_smoke.mjs
      - name: Invite ready campaign analysis without automatic generation
        run: |
          node scripts/workspace_synthesis_readiness_smoke.mjs
          node scripts/workspace_synthesis_readiness_layout_smoke.mjs
      - name: Preserve synthetic saved-page screenshots and exact source bindings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-synthesis-page-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/saved-synthesis-page
            ${{ runner.temp }}/sample-selected-pdf
            ${{ runner.temp }}/sample-header-offset
            ${{ runner.temp }}/checkout-success-recovery
            ${{ runner.temp }}/evaluation-countdown
            /tmp/monderman-readiness-ui-*
            /tmp/monderman-readiness-layout-*
          if-no-files-found: error
  financial-methodology-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The methodology test preserves exact historical article copy.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          bash scripts/install_ci_browsers.sh
      - name: Preserve the notice on historical single-run financial prose
        run: node scripts/report_financial_legacy_notice_smoke.mjs
      - name: Keep individual results nonfinancial in screen and print layouts
        run: node scripts/single_run_financial_display_smoke.mjs
      - name: Preserve historical v1 financial summaries and honest downside
        env:
          REPORT_FINANCIAL_BLUF_OUT: ${{ runner.temp }}/report-financial-bluf
        run: node scripts/report_financial_bluf_smoke.mjs
      - name: Verify three-benefit reports, partial assessments and reconciled planning cases
        env:
          REPORT_THREE_BENEFIT_OUT: ${{ runner.temp }}/report-three-benefit
        run: node scripts/report_three_benefit_smoke.mjs
      - name: Verify optional operational scenario entry with synthetic transport
        run: node scripts/campaign_financial_scenario_smoke.mjs
      - name: Check synthetic preview financial policy without changing public samples
        run: node scripts/public_sample_preview_financial_policy_smoke.mjs --browser --out ${{ runner.temp }}/financial-preview-mock
      - name: Verify three-benefit previews against recorded calculator fixtures
        run: node scripts/public_sample_three_benefit_preview_smoke.mjs
      - name: Verify published methodology copy and settled browser presentation
        run: node scripts/methodology_business_copy_smoke.mjs --output=${{ runner.temp }}/methodology-copy
      - name: Preserve bounded financial and methodology browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-methodology-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/monderman-single-run-financial-display-*
            /tmp/monderman-financial-scenario-ui-*
            ${{ runner.temp }}/financial-preview-mock
            ${{ runner.temp }}/report-financial-bluf
            ${{ runner.temp }}/report-three-benefit
            /tmp/monderman-three-benefit-preview-*
            ${{ runner.temp }}/methodology-copy
          if-no-files-found: error
