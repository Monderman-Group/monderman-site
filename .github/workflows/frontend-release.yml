name: Frontend release gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel to certify
        required: true
        default: beta
        type: choice
        options: [beta, production]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MONDERMAN_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'beta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/validate_stabilization.py
      - name: Keep public search copy and disclosures current
        run: python scripts/build_public_search_index.py --check
      - name: Reject scanner-consumed email authentication regressions
        run: node scripts/signin_email_otp_smoke.mjs
      - run: node scripts/workspace_legal_gate_smoke.mjs
      - name: Reject purchase-confirmation and onboarding regressions
        run: node scripts/signup_package_smoke.mjs
      - name: Verify free entry and pilot funnel contracts
        run: node scripts/first_run_entry_smoke.mjs
      - name: Verify transparent email mark asset
        run: node scripts/email_mark_asset_smoke.mjs
      - name: Reject private Pattern pilot feedback regressions
        run: node --check scripts/pilot_feedback_browser_smoke.mjs
      - run: node scripts/campaign_participant_reliability_smoke.mjs
      - name: Reject cross-member Workspace context regressions
        run: python scripts/validate_workspace_membership_scope.py
      - name: Reject authenticated Diagnostic draft-recovery regressions
        run: node scripts/diagnostic_draft_recovery_smoke.mjs
      - name: Preserve report wording and display-version provenance
        run: |
          node scripts/report_language_provenance_smoke.mjs
          node scripts/report_recorded_context_smoke.mjs
          node scripts/report_missing_estimate_smoke.mjs
          node scripts/report_synthesis_display_smoke.mjs --deterministic-only
      - name: Verify diagnostic labels and immutable saved-report presentation
        run: |
          node scripts/diagnostic_display_language_smoke.mjs
          node scripts/sc_ip_chart_binding_smoke.mjs
          node scripts/authenticated_report_engine_fixture.mjs
      - name: Verify compatibility bridge and explicit questionnaire activation
        run: node scripts/questionnaire_release_build_smoke.mjs
      - name: Keep modeled currency display ranges consistent and bounded
        run: node scripts/diagnostic_currency_display_smoke.mjs
      - name: Keep AI Interview collection outside the bounded pilot
        run: node scripts/interview_disabled_smoke.mjs
      - name: Quarantine participant evidence on every report surface
        run: node scripts/participant_evidence_boundary_smoke.mjs
      - name: Reject predictive, causal, realized-savings, and generalized claims
        run: node scripts/partner_visible_claims_smoke.mjs
      - name: Reject cross-Workspace Diagnostic persistence regressions
        run: node scripts/diagnostic_workspace_selection_smoke.mjs
      - name: Reject cross-Workspace data-surface regressions
        run: node scripts/workspace_tenant_scope_smoke.mjs
      - name: Reject duplicate Synthesis submissions and premature deferred-report polling
        run: |
          node scripts/synthesis_request_state_smoke.mjs
          node scripts/report_ai_deferred_poll_smoke.mjs
      - name: Reject Diagnostic completion-protection regressions
        run: node scripts/diagnostic_completion_reliability_smoke.mjs
      - run: python scripts/validate_frontend_release.py
      - name: Reject production cosmetic and copy regressions
        run: |
          python scripts/validate_production_cosmetic_certification.py
          python scripts/certification_guard_sensitivity_smoke.py
      - name: Verify candidate diff integrity
        run: git diff --check
