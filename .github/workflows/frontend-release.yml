name: Frontend release gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical Platform Brief header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('Monderman_Platform_Brief.html')
          text = p.read_text(encoding='utf-8')

          old_header = '<header class="topbar" aria-label="Platform brief navigation"><div class="topbar-inner"><a class="brand" href="index.html" aria-label="Monderman home">Monderman<span class="brand-dot"></span><span class="deck-label">Platform brief</span></a><nav class="top-actions" aria-label="Brief actions"><a href="sample-report.html">Sample reports</a><a href="platform-services.html">Plans</a><a class="top-cta" href="diagnostics.html">Run a Diagnostic</a></nav></div></header>'
          new_header = '<header class="header" id="siteHeader"><div class="header-inner"><a class="brand" href="index.html">Monderman<span class="brand-dot"></span></a><nav aria-label="Primary navigation" class="nav"><a href="index.html#approach">Approach</a><a href="diagnostics.html">Diagnostics</a><a href="research.html">Research</a><a href="why-monderman.html">Why Monderman</a><a href="about.html">About</a><a href="platform-services.html">Platform Services</a><a href="connect.html">Connect</a><a class="workspace-link" href="signin.html?next=workspace.html">Sign In</a></nav></div></header>'

          canonical_css = '''.header{position:fixed;inset:0 0 auto 0;width:100%;height:72px;z-index:120;background:rgba(4,24,27,.80);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;transition:background 220ms var(--ease),border-color 220ms var(--ease)}.header.scrolled{background:rgba(4,24,27,.94);border-bottom-color:rgba(255,255,255,.11)}.header-inner{width:min(1320px,100%);height:100%;margin:0 auto;padding:0 34px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:inline-flex;align-items:center;gap:0;font-size:1.32rem;font-weight:700;letter-spacing:-.02em;color:#fff;white-space:nowrap}.brand-dot{width:6px;height:6px;margin-left:10px;background:var(--teal);border-radius:1px;display:inline-block;transform:translateY(-1px);flex-shrink:0}.nav{display:flex;align-items:center;gap:20px;flex-wrap:nowrap;justify-content:flex-end}.nav a{position:relative;font-size:.9rem;font-weight:500;letter-spacing:.012em;color:rgba(255,255,255,.88);white-space:nowrap;transition:color 180ms ease,transform 180ms ease}.nav a::after{content:"";position:absolute;left:0;bottom:-6px;width:100%;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left center;transition:transform 180ms ease}.nav a:hover,.nav a:focus-visible{color:#fff;transform:translateY(-1px);outline:none}.nav a:hover::after,.nav a:focus-visible::after{transform:scaleX(1)}.nav a.workspace-link{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:7px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-weight:500;white-space:nowrap}.nav a.workspace-link::after{display:none}.nav a.workspace-link:hover,.nav a.workspace-link:focus-visible{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.24);color:#fff;transform:none}'''

          if old_header in text:
              text = text.replace('--topbar:62px;', '--topbar:72px;', 1)
              text, n = re.subn(r'\.topbar\{.*?\.top-cta\{.*?\}\n', canonical_css + '\n', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'canonical header CSS replacement count={n}')
              text = text.replace(old_header, new_header, 1)

              tablet_old = '@media(max-width:980px){html{scroll-snap-type:y proximity}'
              tablet_new = '@media(max-width:980px){:root{--topbar:104px}.header,.header.scrolled{height:auto;background:#08383E;border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:none;-webkit-backdrop-filter:none}.header-inner{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 20px 10px;height:auto}.brand{flex:0 0 auto}.nav{display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;align-items:center;gap:10px;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0 8px}.nav::-webkit-scrollbar{display:none}.nav a{flex:0 0 auto;white-space:nowrap;font-size:.88rem;line-height:1;padding:10px 12px;border-radius:7px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);color:rgba(245,241,232,.88)}.nav a::after{display:none}.nav a:hover,.nav a:focus-visible{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18);color:#fff;transform:none}.nav a.workspace-link{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff;font-weight:600}html{scroll-snap-type:y proximity}'
              if text.count(tablet_old) != 1:
                  raise SystemExit('tablet media anchor missing')
              text = text.replace(tablet_old, tablet_new, 1)

              mobile_old = '@media(max-width:680px){:root{--topbar:56px}.topbar-inner{padding:0 15px}.deck-label,.top-actions a:not(.top-cta){display:none}'
              mobile_new = '@media(max-width:680px){:root{--topbar:100px}.header-inner{padding:12px 16px 9px;gap:9px}.nav{gap:8px;padding-bottom:7px}.nav a{font-size:.84rem;padding:9px 11px}'
              if text.count(mobile_old) != 1:
                  raise SystemExit('mobile topbar anchor missing')
              text = text.replace(mobile_old, mobile_new, 1)

              text = text.replace('.topbar,.progress,.skip-link{display:none!important}', '.header,.progress,.skip-link{display:none!important}', 1)

              auth_script = '''\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0" integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti" crossorigin="anonymous"></script>\n<script>\n(()=>{const h=document.getElementById('siteHeader');const applyHeader=()=>h?.classList.toggle('scrolled',window.scrollY>24);applyHeader();window.addEventListener('scroll',applyHeader,{passive:true});const link=document.querySelector('a.workspace-link');if(!link||!window.supabase?.createClient)return;const sb=window.supabase.createClient('https://ptkxrzgmeldalrkfruth.supabase.co','sb_publishable_-4d7OaQvErf0mpdwEJhIoQ_skFiVBhz',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});const apply=async()=>{let signedIn=false;try{const {data}=await sb.auth.getSession();signedIn=!!data?.session?.user}catch(e){}link.textContent=signedIn?'Workspace':'Sign In';link.setAttribute('href',signedIn?'workspace.html':'signin.html?next=workspace.html')};apply();sb.auth.onAuthStateChange(()=>apply())})();\n</script>\n'''
              if '</body>' not in text:
                  raise SystemExit('body close missing')
              text = text.replace('</body>', auth_script + '</body>', 1)
              p.write_text(text, encoding='utf-8')
          elif new_header not in text:
              raise SystemExit('neither old nor canonical Platform Brief header found')

          # Invariants whether this is first run or idempotent rerun.
          final = p.read_text(encoding='utf-8')
          required = [
              '<header class="header" id="siteHeader">',
              'index.html#approach', 'diagnostics.html', 'research.html', 'why-monderman.html',
              'about.html', 'platform-services.html', 'connect.html', 'class="workspace-link"',
              'Composite<br/>threshold', 'Read article →', 'Platform_Brief_Image.jpg'
          ]
          for token in required:
              if token not in final:
                  raise SystemExit(f'missing required token: {token}')
          for token in ['class="topbar"', 'class="top-actions"', 'class="deck-label"']:
              if token in final:
                  raise SystemExit(f'obsolete compact-header token remains: {token}')
          if final.count('id="slide-') != 10:
              raise SystemExit('slide count changed')
          if final.count('class="workspace-link"') != 1:
              raise SystemExit('workspace link count changed')
          PY
      - name: Validate frontend
        run: |
          git diff --check
          python scripts/validate_frontend_release.py
          python scripts/validate_six_product_ecosystem.py
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('Monderman_Platform_Brief.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          Path('/tmp/platform-brief-header.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/platform-brief-header.js
      - name: Commit Platform Brief header
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Monderman_Platform_Brief.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Platform Brief page changes needed"
            exit 0
          fi
          git commit -m "Use canonical navigation on Platform Brief"
          git push origin HEAD:main
