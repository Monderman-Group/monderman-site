name: Temporary Pattern trial lifecycle validation

on:
  push:
    branches:
      - agent/pattern-trial-30day-lifecycle-hardening-20260818
    paths:
      - '.github/workflows/temporary-pattern-trial-lifecycle-site-patch.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-pattern-trial-lifecycle-site-patch.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pattern-trial-30day-lifecycle-hardening-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate lifecycle UX
        run: |
          set -euo pipefail
          python scripts/validate_frontend_release.py
          python scripts/validate_meta_synthesis_frontend.py
          node --check workspace-shell.js
          git diff --check origin/main...HEAD
